name: NVIDIA sandbox verifier generation (one-time)
on:
  push:
    branches:
      - feat/nvidia-build-gateway-sandbox
    paths:
      - .github/workflows/nvidia-sandbox-verifier-regenerate-once.yml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.repository == '777genius/review-router-ai' && github.ref == 'refs/heads/feat/nvidia-build-gateway-sandbox' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact sandbox branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Node 26.11.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.11.1"
      - name: Install pinned pnpm and repo dependencies
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild and independently check deterministic verifier
        run: |
          set -euo pipefail
          node scripts/check-conversation-source-stamp.ts --check
          node scripts/check-conversation-release-verifier.ts --write
          node scripts/check-conversation-release-verifier.ts --check
      - name: Commit only generated verifier outputs (no deployment or release)
        shell: bash
        run: |
          set -euo pipefail
          git add -- deploy/self-hosted/conversation-verifier.mjs deploy/self-hosted/conversation-verifier.d.mts deploy/self-hosted/conversation-verifier.inputs.json deploy/self-hosted/conversation-verifier.NOTICE
          if git diff --cached --quiet; then
            echo "Verifier already coherent; nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(nvidia): regenerate pinned standalone conversation verifier"
          git push origin HEAD:refs/heads/feat/nvidia-build-gateway-sandbox
