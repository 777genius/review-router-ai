name: PR 815 deterministic Action regeneration

on:
  push:
    branches:
      - refactor/action-runtime-critical-boundaries-20261105
    paths:
      - .github/workflows/pr815-regenerate-action-bundle.yml

permissions:
  contents: read

jobs:
  regenerate:
    name: Rebuild checked-in Action bundle and format reviewed sources
    if: ${{ github.repository == '777genius/review-router-ai' && github.actor == '777genius' && github.ref == 'refs/heads/refactor/action-runtime-critical-boundaries-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact trusted branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.11.1"

      - name: Install pinned package manager
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7

      - name: Install frozen private dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile

      - name: Format only reviewed candidate and deployment record
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            .github/workflows/pr815-regenerate-action-bundle.yml \
            ai-docs/plans/2026-11-05-action-runtime-ownership-refactor.md \
            ai-docs/deployments/README.md \
            ai-docs/deployments/2026-11-05-action-runtime-ownership.md \
            scripts/check-architecture-boundaries.mjs \
            packages/features/codex-oauth-rotating/src/action/*.ts \
            packages/features/codex-oauth-rotating/src/domain/codex-contract.ts \
            packages/features/codex-oauth-rotating/src/domain/codex-oauth-rotating.ts \
            packages/features/codex-oauth-rotating/src/domain/codex-workflow.ts

      - name: Generate and verify deterministic checked-in Action
        shell: bash
        run: |
          set -euo pipefail
          pnpm action:build
          pnpm action:artifact:check:smoke
          git diff --exit-code -- action-dist/conflict-runtime.cjs
          sha256sum action-dist/index.cjs
          pnpm format:check
          git diff --check

      - name: Verify changed Action TypeScript and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @reviewrouter/features-codex-oauth-rotating typecheck
          pnpm exec vitest run \
            packages/features/codex-oauth-rotating/src/action/http-retry.test.ts \
            packages/features/codex-oauth-rotating/src/action/hosted-pool-failover.test.ts \
            packages/features/codex-oauth-rotating/src/action/codex-local-provider-proxy.test.ts \
            packages/features/codex-oauth-rotating/src/action/process-output-redactor.test.ts \
            packages/features/codex-oauth-rotating/src/action/git-checkout-custody.test.ts \
            packages/features/codex-oauth-rotating/src/action/review-runtime-environment.test.ts \
            packages/features/codex-oauth-rotating/src/tests/github-action.test.ts

      - name: Commit only reviewed files, then remove this one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refactor/action-runtime-critical-boundaries-20261105"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_sha" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::PR branch changed while artifact was being built; refusing stale push"
            exit 1
          fi
          git add -- \
            action-dist/index.cjs \
            ai-docs/plans/2026-11-05-action-runtime-ownership-refactor.md \
            ai-docs/deployments/README.md \
            ai-docs/deployments/2026-11-05-action-runtime-ownership.md \
            scripts/check-architecture-boundaries.mjs \
            packages/features/codex-oauth-rotating/src/action \
            packages/features/codex-oauth-rotating/src/domain/codex-contract.ts \
            packages/features/codex-oauth-rotating/src/domain/codex-oauth-rotating.ts \
            packages/features/codex-oauth-rotating/src/domain/codex-workflow.ts
          git rm -- .github/workflows/pr815-regenerate-action-bundle.yml
          while IFS= read -r changed; do
            case "$changed" in
              action-dist/index.cjs|ai-docs/plans/2026-11-05-action-runtime-ownership-refactor.md|ai-docs/deployments/README.md|ai-docs/deployments/2026-11-05-action-runtime-ownership.md|scripts/check-architecture-boundaries.mjs|.github/workflows/pr815-regenerate-action-bundle.yml|packages/features/codex-oauth-rotating/src/action/*.ts|packages/features/codex-oauth-rotating/src/domain/codex-contract.ts|packages/features/codex-oauth-rotating/src/domain/codex-oauth-rotating.ts|packages/features/codex-oauth-rotating/src/domain/codex-workflow.ts) ;;
              *) echo "::error::unapproved staged path $changed"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git config user.name "777genius"
          git config user.email "777genius@users.noreply.github.com"
          git commit -m "build(action): format extracted owners and refresh deterministic bundle"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push origin "HEAD:refs/heads/refactor/action-runtime-critical-boundaries-20261105"
