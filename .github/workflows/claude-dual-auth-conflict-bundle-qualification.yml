name: Temporary Claude dual-auth conflict bundle qualification

on:
  push:
    branches:
      - feat/claude-dual-auth-secrets-20261111
    paths:
      - .github/workflows/claude-dual-auth-conflict-bundle-qualification.yml
      - scripts/lib/render-schema-handoff-policy.test.ts
      - packages/features/codex-oauth-rotating/src/action/review-runtime-environment.ts
      - packages/features/workflow-provisioning/src/tests/workflow-template.test.ts

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.11.1"
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
      - run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Format dual-auth source and regression tests
        run: |
          pnpm exec prettier --write \
            packages/features/codex-oauth-rotating/src/action/review-runtime-environment.ts \
            packages/features/workflow-provisioning/src/tests/workflow-template.test.ts \
            scripts/lib/render-schema-handoff-policy.test.ts \
            apps/web/app/dashboard/provider-setup/provider-setup-dialog.tsx \
            apps/web/app/dashboard/provider-setup/provider-setup-dialog.test.tsx
      - name: Rebuild both committed Action bundles from exact source
        run: pnpm action:build
      - name: Verify byte-identical bundles and formatting
        run: |
          pnpm action:artifact:check:smoke
          pnpm exec prettier --check \
            packages/features/codex-oauth-rotating/src/action/review-runtime-environment.ts \
            packages/features/workflow-provisioning/src/tests/workflow-template.test.ts \
            scripts/lib/render-schema-handoff-policy.test.ts \
            apps/web/app/dashboard/provider-setup/provider-setup-dialog.tsx \
            apps/web/app/dashboard/provider-setup/provider-setup-dialog.test.tsx
      - name: Regression tests for deterministic bundling and SQL tail
        run: pnpm exec vitest run scripts/build-codex-rotating-action.test.ts scripts/lib/render-schema-handoff-policy.test.ts apps/web/app/dashboard/provider-setup/provider-setup-dialog.test.tsx
      - name: Commit only qualified generated bundles and formatting
        shell: bash
        run: |
          git add action-dist/index.cjs action-dist/conflict-runtime.cjs \
            packages/features/codex-oauth-rotating/src/action/review-runtime-environment.ts \
            packages/features/workflow-provisioning/src/tests/workflow-template.test.ts \
            scripts/lib/render-schema-handoff-policy.test.ts \
            apps/web/app/dashboard/provider-setup/provider-setup-dialog.tsx \
            apps/web/app/dashboard/provider-setup/provider-setup-dialog.test.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(action): refresh exact-source bundles and format dual-auth changes'
            git push origin HEAD:refs/heads/feat/claude-dual-auth-secrets-20261111
          fi
