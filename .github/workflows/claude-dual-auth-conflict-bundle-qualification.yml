name: Temporary Claude dual-auth conflict bundle qualification

on:
  push:
    branches:
      - feat/claude-dual-auth-secrets-20261111
    paths:
      - .github/workflows/claude-dual-auth-conflict-bundle-qualification.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/claude-dual-auth-secrets-20261111
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.11.1"
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
      - run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Rebuild the committed conflict runtime from current source
        run: node scripts/build-conflict-runtime.ts
      - name: Verify byte-for-byte rebuild and artifact smoke checks
        run: pnpm action:artifact:check:smoke
      - name: Commit only the generated conflict-runtime bundle
        shell: bash
        run: |
          git add action-dist/conflict-runtime.cjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(action): refresh conflict-runtime bundle from exact source'
            git push origin HEAD:refs/heads/feat/claude-dual-auth-secrets-20261111
          fi
