name: Webhook checkpoint qualification

# Temporary branch-only helper. Its checkout pins the subject independently of
# this workflow commit; this is not a replacement for protected PR checks.
on:
  workflow_dispatch:
  push:
    branches: [qualification/webhook-0492-20261128]

permissions:
  contents: read

concurrency:
  group: webhook-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  qualify-webhook-checkpoint:
    name: Exact webhook checkpoint types and PostgreSQL
    if: github.repository == '777genius/review-router-ai' && github.actor == '777genius'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres-webhook-test:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUBJECT_SHA: c6fa2d737dabc163d914066c3d22477b0f2fa7a9
      SUBJECT_TREE: fc50696fc6207f78217f4c0a020e0d9221a139ef
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5435/postgres?schema=public
      AUTH_SECRET: ci-auth-secret-not-used-for-production
      AUTH_TRUST_HOST: "true"
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-used-for-production
      REVIEW_ROUTER_WEB_URL: http://localhost:3000
      REVIEW_ROUTER_PUBLIC_WEB_URL: https://web.reviewrouter.test
      REVIEW_ROUTER_API_URL: http://localhost:4000
      REVIEW_ROUTER_PUBLIC_API_URL: https://api.reviewrouter.test
      REVIEW_ROUTER_ACTION_REF: 777genius/review-router@main
      REVIEW_ROUTER_ACTION_VERSION: main
      REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: 777genius/review-router@66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
      REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS: ""
      REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ci_database_recovery_witness_not_for_production_000000000000
      REVIEW_ROUTER_DEFAULT_MODEL: gpt-5.5
      REVIEW_ROUTER_DEFAULT_EFFORT: xhigh
      REVIEW_ROUTER_PAIRED_ACTION_REF: 1112a0f1de568f9fa927316ab68cef54fbcd4653
      REVIEW_ROUTER_HOSTED_POOL_ACTION_TAG: v1.0.171
      REVIEW_ROUTER_HOSTED_POOL_ACTION_SHA: 66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
      REVIEW_ROUTER_HOSTED_POOL_ACTION_DIST_SHA256: 2a65907ac8474f805dcb23358618c9c673e6a903bf1c3c26fcdf4cfe02debe2a
      REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS: "0"
      REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "0"
      REVIEW_ROUTER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      REVIEW_ROUTER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore

    steps:
      - name: Checkout the immutable subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c6fa2d737dabc163d914066c3d22477b0f2fa7a9
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.11.1"

      - name: Bind source and evidence directory
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
          directory="$RUNNER_TEMP/webhook-checkpoint-c6fa2d"
          mkdir -p "$directory"
          echo "QUALIFICATION_DIRECTORY=$directory" >> "$GITHUB_ENV"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          node --input-type=module > "$directory/source.json" <<'NODE'
          const environment = process.env;
          console.log(JSON.stringify({
            source: environment.SUBJECT_SHA,
            tree: environment.SUBJECT_TREE,
            workflow: environment.GITHUB_SHA,
            run: environment.GITHUB_RUN_ID,
            attempt: environment.GITHUB_RUN_ATTEMPT,
          }, null, 2));
          NODE
          git rev-parse \
            HEAD:pnpm-lock.yaml \
            HEAD:packages/features/github-installations/src/infrastructure/prisma/webhook-effect-fence.ts \
            HEAD:packages/platform/db/src/current-scope-guards.ts \
            HEAD:scripts/webhook-fencing/migrations.postgres.test.ts \
            HEAD:scripts/webhook-fencing/qualification.test.ts \
            HEAD:scripts/webhook-fencing/run-postgres.ts \
            HEAD:scripts/webhook-fencing/results.ts \
            > "$directory/input-blobs.txt"

      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7

      - name: Install PostgreSQL client
        uses: ./.github/actions/setup-postgresql-client

      - name: Install stock subprocess prerequisites
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=15s 5m sudo apt-get \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=2 -o DPkg::Lock::Timeout=30 \
            install -y --no-install-recommends openssh-client procps
          command -v ssh-keygen
          test -x /bin/ps
          /bin/ps -p "$$" -o pid= >/dev/null

      - name: Install the stock frozen dependency graph
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile

      - name: Install the locked Accounts tooling dependencies
        run: pnpm --dir scripts/accounts-reference-e2e install --frozen-lockfile

      - name: Generate the actual Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs

      - name: Generate stock Next.js route types
        working-directory: apps/web
        run: pnpm exec next typegen

      - name: Bootstrap stock contract sources and verify preparation
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-review-action-v2-protocol.mjs --bootstrap-only
          test "$(node --version)" = v26.11.1
          test "$(pnpm --version)" = 11.28.7
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
          {
            node --version
            pnpm --version
            pnpm exec prettier --version
            node scripts/local-checks/compiler-cli.ts --native --version
            /usr/lib/postgresql/17/bin/psql --version
          } > "$QUALIFICATION_DIRECTORY/tool-versions.txt"

      - name: Check native formatting and preserve exact formatter outputs
        id: format
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/local-checks/lint-format-native-load-guard.ts"
          export REVIEWROUTER_NATIVE_FORMAT_AUDIT="$QUALIFICATION_DIRECTORY/native-format-audit.jsonl"
          set +e
          pnpm exec prettier --check \
            packages/features/github-installations/src/infrastructure/prisma/webhook-effect-fence.ts \
            packages/platform/db/src/current-scope-guards.ts \
            scripts/webhook-fencing/migrations.postgres.test.ts \
            scripts/webhook-fencing/qualification.test.ts \
            2>&1 | tee "$QUALIFICATION_DIRECTORY/native-format.log"
          format_status=$?
          set -e
          for path in \
            packages/features/github-installations/src/infrastructure/prisma/webhook-effect-fence.ts \
            packages/platform/db/src/current-scope-guards.ts \
            scripts/webhook-fencing/migrations.postgres.test.ts \
            scripts/webhook-fencing/qualification.test.ts; do
            output="$QUALIFICATION_DIRECTORY/formatted/$path"
            mkdir -p "$(dirname "$output")"
            pnpm exec prettier --config .prettierrc.json "$path" > "$output"
            printf '%s original=%s formatted=%s\n' \
              "$path" "$(git rev-parse "HEAD:$path")" "$(git hash-object "$output")" \
              >> "$QUALIFICATION_DIRECTORY/native-format-blobs.txt"
            diff_status=0
            diff -u --label "a/$path" --label "b/$path" "$path" "$output" \
              >> "$QUALIFICATION_DIRECTORY/native-format.patch" || diff_status=$?
            if [[ "$diff_status" -gt 1 ]]; then exit "$diff_status"; fi
          done
          pnpm exec prettier --config .prettierrc.json --check \
            "$QUALIFICATION_DIRECTORY/formatted/packages/features/github-installations/src/infrastructure/prisma/webhook-effect-fence.ts" \
            "$QUALIFICATION_DIRECTORY/formatted/packages/platform/db/src/current-scope-guards.ts" \
            "$QUALIFICATION_DIRECTORY/formatted/scripts/webhook-fencing/migrations.postgres.test.ts" \
            "$QUALIFICATION_DIRECTORY/formatted/scripts/webhook-fencing/qualification.test.ts"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const events = readFileSync(process.env.REVIEWROUTER_NATIVE_FORMAT_AUDIT, "utf8")
            .trim().split("\n").filter(Boolean).map((line) => JSON.parse(line));
          assert(events.some((event) =>
            event.event === "formatter-module" &&
            typeof event.url === "string" &&
            event.url.includes("@prettier/plugin-oxc")
          ), "official native Prettier plugin was not observed");
          assert(!events.some((event) =>
            event.event === "blocked-before-initialization"
          ), "a prohibited parser or compiler was requested");
          NODE
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { join } from "node:path";
          for (const path of ["packages/features/github-installations/src/infrastructure/prisma/webhook-effect-fence.ts","packages/platform/db/src/current-scope-guards.ts","scripts/webhook-fencing/migrations.postgres.test.ts","scripts/webhook-fencing/qualification.test.ts"]) {
            const bytes = readFileSync(join(process.env.QUALIFICATION_DIRECTORY, "formatted", path));
            const gitBlob = createHash("sha1").update(`blob ${bytes.length}\0`).update(bytes).digest("hex");
            const sha256 = createHash("sha256").update(bytes).digest("hex");
            const original = execFileSync("git", ["rev-parse", `HEAD:${path}`], { encoding: "utf8" }).trim();
            console.log("RR_NATIVE_FORMAT_BLOB " + JSON.stringify({ path, source: process.env.SUBJECT_SHA, original, gitBlob, sha256, base64: bytes.toString("base64") }));
          }
          NODE
          exit "$format_status"

      - name: Run the exact native tooling typecheck
        id: tooling
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/local-checks/lint-format-native-load-guard.ts"
          export REVIEWROUTER_NATIVE_FORMAT_AUDIT="$QUALIFICATION_DIRECTORY/native-typecheck-audit.jsonl"
          node scripts/local-checks/compiler-cli.ts --native --noEmit -p tsconfig.tooling.json \
            2>&1 | tee "$QUALIFICATION_DIRECTORY/tooling-types.log"
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Run the unchanged complete webhook PostgreSQL qualification
        id: postgres
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          WEBHOOK_FENCE_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5435/postgres
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
          node scripts/webhook-fencing/run-postgres.ts \
            2>&1 | tee "$QUALIFICATION_DIRECTORY/postgres.log"
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Record independent check outcomes and final source
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        env:
          PREPARATION_OUTCOME: ${{ steps.prepare.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module > "$QUALIFICATION_DIRECTORY/outcomes.json" <<'NODE'
          import { execFileSync } from "node:child_process";
          const environment = process.env;
          const revision = (ref) => execFileSync("git", ["rev-parse", ref], { encoding: "utf8" }).trim();
          console.log(JSON.stringify({
            source: environment.SUBJECT_SHA,
            actualSource: revision("HEAD"),
            actualTree: revision("HEAD^{tree}"),
            preparation: environment.PREPARATION_OUTCOME,
            nativeFormat: environment.FORMAT_OUTCOME,
            toolingTypes: environment.TOOLING_OUTCOME,
            completePostgresHarness: environment.POSTGRES_OUTCOME,
          }, null, 2));
          NODE
          git status --porcelain --untracked-files=all > "$QUALIFICATION_DIRECTORY/final-source-status.txt"
          for report in tmp/webhook-fencing-*/postgres-results-*.json; do
            if [[ -f "$report" ]]; then
              destination="$QUALIFICATION_DIRECTORY/postgres-reports/$(basename "$(dirname "$report")")"
              mkdir -p "$destination"
              cp -- "$report" "$destination/"
            fi
          done

      - name: Upload exact source, native outputs and all PostgreSQL reports
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webhook-c6fa2d-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}/
          if-no-files-found: error
          retention-days: 7
