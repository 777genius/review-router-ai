name: Memory final handoff diagnostics
on:
  push:
    branches: [agent/memory-final-handoff-diagnostics]
    paths: [.github/workflows/memory-final-handoff-diagnostics.yml]
permissions:
  contents: write
concurrency:
  group: memory-final-handoff-diagnostics
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ${{ vars.CI_LINUX_CHECKS_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
      REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
      REVIEW_ROUTER_CONVERSATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reviewrouter_conversation_test
      AUTH_SECRET: ci-auth-secret-not-used-for-production
      AUTH_TRUST_HOST: 'true'
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-used-for-production
      REVIEW_ROUTER_WEB_URL: http://localhost:3000
      REVIEW_ROUTER_PUBLIC_WEB_URL: https://web.reviewrouter.test
      REVIEW_ROUTER_API_URL: http://localhost:4000
      REVIEW_ROUTER_PUBLIC_API_URL: https://api.reviewrouter.test
      REVIEW_ROUTER_ACTION_REF: 777genius/review-router@main
      REVIEW_ROUTER_ACTION_VERSION: main
      REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: 777genius/review-router@66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
      REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ci_database_recovery_witness_not_for_production_000000000000
      REVIEW_ROUTER_DEFAULT_MODEL: gpt-5.5
      REVIEW_ROUTER_DEFAULT_EFFORT: xhigh
      REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS: '0'
      REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: '0'
      REVIEW_ROUTER_ACTION_SOURCE_DIR: ${{ github.workspace }}/.paired/review-router-action
      REVIEW_ROUTER_REVIEW_INVESTIGATION_PAIRED_E2E: '1'
      REVIEW_ROUTER_MEMORY_PAIRED_E2E: '1'
      REVIEW_ROUTER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      REVIEW_ROUTER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 08e39a3928e6bf7752512099575a9d87602e8811
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: 777genius/review-router
          ref: 99cbd748aa025e27d5d9f689c3173c33b2d6b418
          path: .paired/review-router-action
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.11.1
      - name: Prepare exact toolchain and sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 08e39a3928e6bf7752512099575a9d87602e8811
          test "$(git -C .paired/review-router-action rev-parse HEAD)" = 99cbd748aa025e27d5d9f689c3173c33b2d6b418
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          npm ci --ignore-scripts --prefix .paired/review-router-action
          pnpm --dir packages/context-memory build
          mkdir -p tmp/memory-final-handoff
      - name: Install PostgreSQL client
        uses: ./.github/actions/setup-postgresql-client
      - name: Prepare disposable databases
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: 'postgresql://postgres:postgres@127.0.0.1:5432/postgres' });
          await client.connect();
          try {
            for (const name of ['review_router_ci', 'review_router_ci_test', 'reviewrouter_conversation_test']) await client.query(`CREATE DATABASE ${pg.escapeIdentifier(name)}`);
          } finally { await client.end(); }
          NODE
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --dir packages/platform/db db:migrate:deploy
      - name: Reproduce original lifecycle fixture failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts --testNamePattern '\(success\)' --reporter=json --outputFile=tmp/memory-final-handoff/before.json >tmp/memory-final-handoff/before.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('tmp/memory-final-handoff/before.json', 'utf8'));
          assert.equal(report.numFailedTests, 1);
          const failed = report.testResults.flatMap(suite => suite.assertionResults).filter(test => test.status === 'failed');
          assert.equal(failed.length, 1);
          assert.match(failed[0].failureMessages.join('\n'), /expected \[\] to have a length of 1/);
          console.log('Reproduced exact empty lifecycle packet failure on original immutable input.');
          NODE
      - name: Repair synthetic published-comment metadata and assert eligibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts')
          s = p.read_text()
          old = '            createdAt: parentCreatedAt,\n            updatedAt: parentCreatedAt,\n'
          new = old + '            publishedAt: parentCreatedAt,\n            lastEditedAt: null,\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '      expect(prompt.revalidationTargets).toHaveLength(4);\n'
          new = old + '''      // Published and never edited: missing GitHub edit metadata must not
                // accidentally turn this positive-path fixture into manual-only work.
                for (const target of prompt.revalidationTargets) {
                  expect(target).toMatchObject({
                    trusted: true,
                    parentEdited: false,
                    markerAmbiguous: false,
                  });
                }
          '''
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          PY
          pnpm exec prettier --write scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts
          pnpm exec eslint scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts
      - name: Qualify full paired suite and memory wire path
        run: |
          pnpm exec vitest run --no-file-parallelism \
            scripts/review-investigation-paired-e2e/review-investigation-paired.e2e.test.ts \
            scripts/review-investigation-paired-e2e/openrouter-direct-paired.e2e.test.ts \
            scripts/review-investigation-paired-e2e/pr-description-paired.e2e.test.ts \
            scripts/review-investigation-paired-e2e/review-banner-comparison-paired.e2e.test.ts \
            scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts \
            scripts/memory-e2e/paired-action-memory.pg.test.ts \
            --reporter=default --reporter=json --outputFile=tmp/memory-final-handoff/paired.json
      - name: Qualify finite conversation PostgreSQL path
        run: |
          pnpm exec vitest run apps/api/src/action-conversation-finite-path.pg.test.ts \
            --reporter=default --reporter=json --outputFile=tmp/memory-final-handoff/conversation.json
      - name: Preserve real missing-metadata safety regressions
        run: |
          npm --prefix .paired/review-router-action test -- --runInBand --runTestsByPath \
            __tests__/unit/github/review-thread-inventory.test.ts \
            __tests__/unit/review-orchestration/github-review-state-adapter.test.ts \
            __tests__/unit/finding-revalidation/revalidation.test.ts \
            --json --outputFile="$GITHUB_WORKSPACE/tmp/memory-final-handoff/action-guards.json"
      - name: Require complete qualification without skipped tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const [file, count] of [['paired.json',24], ['conversation.json',17], ['action-guards.json',null]]) {
            const report = JSON.parse(readFileSync(`tmp/memory-final-handoff/${file}`, 'utf8'));
            assert.equal(report.success, true, file);
            if (count !== null) assert.equal(report.numTotalTests, count, file);
            assert(report.numPassedTests > 0, file);
            assert.equal(report.numPassedTests, report.numTotalTests, file);
            assert.equal(report.numPendingTests, 0, file);
            assert.equal(report.numFailedTests, 0, file);
            assert.equal(report.numTodoTests ?? 0, 0, file);
            console.log(file, report.numPassedTests, 'passed; no skipped tests');
          }
          NODE
      - name: Record exact scope and next-agent handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          run = f"https://github.com/777genius/review-router-ai/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report = json.loads(Path('tmp/memory-final-handoff/action-guards.json').read_text())
          section = f'''## 2026-10-29 final lifecycle-fixture repair and merge handoff

          The previous final-head CI [40868138527](https://github.com/777genius/review-router-ai/actions/runs/40868138527)
          exposed seven paired lifecycle failures before the subsequent memory wire
          step could run. The paired Action correctly rejects unknown edit metadata;
          the synthetic GitHub parents lacked `publishedAt` and `lastEditedAt`.
          This follow-up adds those fields only to the fixture and asserts trusted,
          unedited, unambiguous targets before planning. No production guard, packet
          assertion, publication policy, timeout or required CI gate is weakened.

          [Bounded qualification]({run}) starts from exact control-plane
          `08e39a3928e6bf7752512099575a9d87602e8811` and paired Action
          `99cbd748aa025e27d5d9f689c3173c33b2d6b418`. It reproduces the original
          empty-packet failure, then passes all 24 paired investigation/lifecycle,
          description, banner and memory HTTP/PostgreSQL tests; 17 finite-conversation
          PostgreSQL tests; and {report['numPassedTests']} Action inventory/adapter/revalidation guard tests.
          The successful suites have zero skipped/todo tests. The intentionally
          filtered before-fix reproduction is negative evidence, not a passing suite.
          Exact reports and the tested patch are retained in that run's artifact.

          Action #349 and #350 are merged as `7713c978f852f16b359ab816135a0b45de0c2ad1`
          and `8a6bb7395556ddabbda4b8275bc9e2de6fea4f8e`. Control-plane #734 remains
          for the next agent to merge after the final feature-head required checks
          pass. Verify the actual latest SHA and conclusions; this focused run does
          not replace full CI, the protected main release checks or approval.
          Do not merge the disposable diagnostic workflow into the feature branch.

          The [deployment task](../deployments/2026-10-29-conversational-memory.md)
          and its index remain the rollout authority: staging and production are
          separately pending. Live selected-model evaluation, native privacy and
          installed GitHub App publication remain activation requirements, not
          unimplemented source features or claims established by deterministic tests.
          No production deployment, release registration, activation or new
          independent-model review is claimed by this fixture repair.

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.split('\n'))
          p = Path('ai-docs/plans/2026-10-28-conversational-memory-implementation.md')
          text = p.read_text()
          anchor = '## 2026-10-29 final paired runtime integration'
          assert text.count(anchor) == 1
          text = text.replace(anchor, section + anchor)
          old = 'Neither draft PR is merged; no release registration, deployment, registry publication or contextual-profile activation has been performed.'
          assert text.count(old) == 1
          text = text.replace(old, 'At that historical checkpoint neither draft PR was merged. The final handoff above records the subsequent Action merges; no release registration, deployment, registry publication or contextual-profile activation has been performed.')
          p.write_text(text)
          p = Path('ai-docs/deployments/2026-10-29-conversational-memory.md')
          text = p.read_text()
          anchor = '## Related evidence'
          assert text.count(anchor) == 1
          text = text.replace(anchor, f'''## Source merge handoff

          The [implementation record](../plans/2026-10-28-conversational-memory-implementation.md#2026-10-29-final-lifecycle-fixture-repair-and-merge-handoff)
          records the final fixture repair, exact pair and [observed qualification]({run}).
          Another agent owns the control-plane merge after final-head required checks;
          Action #349/#350 are already merged. Read the current PR head and checks,
          then protected main checks before following the ordered rollout above.
          Neither this source follow-up nor its disposable workflow changes the
          staging/production status or supplies live activation evidence.

          '''.replace('\n          ', '\n') + anchor)
          p.write_text(text)
          PY
          pnpm exec prettier --write ai-docs/plans/2026-10-28-conversational-memory-implementation.md ai-docs/deployments/2026-10-29-conversational-memory.md
          pnpm exec prettier --check scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts ai-docs/plans/2026-10-28-conversational-memory-implementation.md ai-docs/deployments/2026-10-29-conversational-memory.md
      - name: Publish bounded tested candidate without touching feature or main
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts','ai-docs/plans/2026-10-28-conversational-memory-implementation.md','ai-docs/deployments/2026-10-29-conversational-memory.md'}
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == expected
          PY
          git config user.name 777genius
          git config user.email iliyazelenkog@gmail.com
          git add scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts ai-docs/plans/2026-10-28-conversational-memory-implementation.md ai-docs/deployments/2026-10-29-conversational-memory.md
          git commit -m 'test(memory): close paired lifecycle regression and document merge handoff'
          git show --stat --oneline HEAD
          git rev-parse HEAD >tmp/memory-final-handoff/qualified-sha.txt
          git diff HEAD^ HEAD --binary >tmp/memory-final-handoff/qualified.patch
          git push origin HEAD:refs/heads/agent/memory-final-handoff-verified
      - name: Preserve bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-final-handoff-qualification
          path: tmp/memory-final-handoff/
          if-no-files-found: error
          retention-days: 14
