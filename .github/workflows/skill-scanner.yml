name: Skill scanner runtime acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/skill-scanner.yml
      - services/skill-scanner/**
  push:
    branches: [main]
    paths:
      - .github/workflows/skill-scanner.yml
      - services/skill-scanner/**

permissions:
  contents: read

concurrency:
  group: skill-scanner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scanner-runtime:
    name: Real SkillSpector and Docker isolation
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_CHECKS_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: skill-scanner-acceptance
      REVIEW_ROUTER_SKILL_SCANNER_TOKEN: fixture-private-scanner-token-000000000000000000000000
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build pinned scanner image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          mkdir -p tmp/skill-scanner-ci
          docker build --tag reviewrouter-skill-scanner:local services/skill-scanner

      - name: Run real static and AI workflows and process boundary regressions
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 64 --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/skill-scanner,target=/tests,readonly" \
            --entrypoint /venv/bin/python reviewrouter-skill-scanner:local \
            -B -m unittest discover -s /tests -p test_server.py -v \
            2>&1 | tee tmp/skill-scanner-ci/native-tests.log

      - name: Verify the production container and bounded egress
        run: |
          set -euo pipefail
          docker compose -f services/skill-scanner/compose.yaml up --detach --no-build
          docker compose -f services/skill-scanner/compose.yaml exec -T skill-scanner \
            /venv/bin/python -B - < services/skill-scanner/test_container.py \
            | tee tmp/skill-scanner-ci/container.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('tmp/skill-scanner-ci/container.json').read_text())
          assert receipt['containerQualified'] is True
          assert receipt['tmpfsEnospcBytes'] == 32 * 1024 * 1024
          receipt['revision'] = os.environ['EXPECTED_REVISION']
          Path('tmp/skill-scanner-ci/receipt.json').write_text(json.dumps(receipt, indent=2))
          PY
          git diff --exit-code HEAD

      - name: Retain runtime logs and stop owned containers
        if: always()
        run: |
          mkdir -p tmp/skill-scanner-ci
          docker compose -f services/skill-scanner/compose.yaml logs --no-color > tmp/skill-scanner-ci/containers.log
          docker compose -f services/skill-scanner/compose.yaml down --timeout 5 --volumes --remove-orphans

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skill-scanner-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/skill-scanner-ci/
          if-no-files-found: error
          retention-days: 14
