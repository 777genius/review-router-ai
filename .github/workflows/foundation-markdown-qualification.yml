# Temporary qualification only; removed when the generated lock is adopted.
name: Foundation Markdown qualification
on:
  push:
    branches: [arch/foundation-default-adoption-20261125]
    paths: [.github/workflows/foundation-markdown-qualification.yml]
permissions:
  contents: read
concurrency:
  group: foundation-markdown-qualification
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ${{ vars.CI_STATIC_CHECKS_RUNNER || vars.CI_LINUX_CHECKS_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=2048 --max-semi-space-size=8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2d0dc642b1d2ba07c21c7c63fe7f8ecf769ebab3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
      - name: Pin the resolver and record both source identities
        run: |
          set -euo pipefail
          QUALIFICATION_DIR="$RUNNER_TEMP/foundation-markdown"
          FOUNDATION_PROBE_DIR="$RUNNER_TEMP/foundation-markdown-probe"
          printf '%s\n' "QUALIFICATION_DIR=$QUALIFICATION_DIR" "FOUNDATION_PROBE_DIR=$FOUNDATION_PROBE_DIR" >> "$GITHUB_ENV"
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          test "$(node --version)" = v26.11.1
          test "$(pnpm --version)" = 11.28.7
          test "$(git rev-parse HEAD)" = 2d0dc642b1d2ba07c21c7c63fe7f8ecf769ebab3
          test "$(git rev-parse 'HEAD^{tree}')" = 4e1d1bdd949ee2ca96cc2963cf7d94fff3ce7aac
          mkdir -p "$QUALIFICATION_DIR" "$FOUNDATION_PROBE_DIR"
          git rev-parse HEAD > "$QUALIFICATION_DIR/source-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$QUALIFICATION_DIR/source-tree.txt"
          printf '%s\n' "$GITHUB_SHA" > "$QUALIFICATION_DIR/workflow-revision.txt"
          node --version > "$QUALIFICATION_DIR/node-version.txt"
          pnpm --version > "$QUALIFICATION_DIR/pnpm-version.txt"
      - name: Generate the root lock with the real pinned resolver
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node scripts/install-private-dependencies.mjs --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --exit-code -- . ':!pnpm-lock.yaml'
          git diff --check
          cp pnpm-lock.yaml "$QUALIFICATION_DIR/pnpm-lock.yaml"
          git diff -- pnpm-lock.yaml > "$QUALIFICATION_DIR/pnpm-lock.diff"
          sha256sum pnpm-lock.yaml > "$QUALIFICATION_DIR/pnpm-lock.sha256"
          git hash-object pnpm-lock.yaml > "$QUALIFICATION_DIR/pnpm-lock.git-blob"
      - name: Preserve the public resolver output for executor-independent retrieval
        run: |
          set -euo pipefail
          printf '%s\n' RR1002_LOCKFILE_BASE64_BEGIN
          base64 -w 76 "$QUALIFICATION_DIR/pnpm-lock.yaml"
          printf '%s\n' RR1002_LOCKFILE_BASE64_END
          cat "$QUALIFICATION_DIR/pnpm-lock.sha256" "$QUALIFICATION_DIR/pnpm-lock.git-blob"
      - name: Prove the generated lock supports a frozen tooling install
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node scripts/install-private-dependencies.mjs --ignore-scripts --frozen-lockfile
          cmp pnpm-lock.yaml "$QUALIFICATION_DIR/pnpm-lock.yaml"
          git diff --exit-code -- . ':!pnpm-lock.yaml'
          pnpm foundation:assert-dev-only
          pnpm foundation:assert-registry
      - name: Qualify the published CLI and disposable negative probes
        env:
          NODE_OPTIONS: --max-old-space-size=1024 --import=${{ github.workspace }}/scripts/local-checks/lint-format-native-load-guard.ts
          REVIEWROUTER_NATIVE_FORMAT_AUDIT: ${{ runner.temp }}/foundation-markdown/foundation-native-audit.ndjson
        run: |
          set -euo pipefail
          cli="$PWD/node_modules/@agent-teams/engineering-foundation/dist/cli.js"
          artifact=docs/release-evidence/activation-catalog-policy-v29-schema-v5-independent-review.md
          policy=architecture/foundation/documentation-local-references.yaml
          artifact_digest=7abaefccd0fa7771c6594824df794415801771f68f14bf0521d2d2461b360528
          test "$(wc -c < "$artifact")" -eq 12600
          printf '%s  %s\n' "$artifact_digest" "$artifact" | sha256sum -c -
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            assert.equal(JSON.parse(readFileSync("node_modules/@agent-teams/engineering-foundation/package.json")).version, "4.1.0");
            assert.equal(JSON.parse(readFileSync("node_modules/typescript/package.json")).version, "7.0.2");
          '
          node "$cli" check --consumer "$PWD" --json > "$QUALIFICATION_DIR/foundation-baseline.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1]));
            assert.equal(report.foundationVersion, "4.1.0");
            assert.equal(report.coverage, "full");
            assert.equal(report.outcome, "passed");
            assert.deepEqual(report.summary, { errors: 0, warnings: 0, infos: 21 });
            assert.deepEqual(report.capabilities.map((c) => c.capabilityId).sort(), [
              "architecture.source-dependencies",
              "documentation.local-references",
              "quality.suppression-governance",
              "repository.agent-workflow",
            ]);
            const diagnostics = report.capabilities.flatMap((c) => c.diagnostics);
            assert.equal(diagnostics.length, 21);
            assert(diagnostics.every((d) => d.ruleId === "documentation.local-references.historical-absolute-reference" && d.severity === "info"));
          ' "$QUALIFICATION_DIR/foundation-baseline.json"

          git archive HEAD | tar -x -C "$FOUNDATION_PROBE_DIR"
          expect_violation() {
            set +e
            node "$cli" check documentation.local-references --consumer "$FOUNDATION_PROBE_DIR" --json > "$QUALIFICATION_DIR/$1.json"
            probe_status=$?
            set -e
            test "$probe_status" -eq 1
          }
          expect_historical_rejection() {
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync(process.argv[1]));
              assert.equal(report.outcome, "violations");
              assert.deepEqual(report.summary, { errors: 22, warnings: 0, infos: 0 });
              const diagnostics = report.capabilities.flatMap((c) => c.diagnostics);
              assert.equal(diagnostics.filter((d) => d.ruleId === "documentation.local-references.invalid-reference").length, 21);
              const rejected = diagnostics.filter((d) => d.ruleId === "documentation.local-references.historical-artifact-invalid");
              assert.equal(rejected.length, 1);
              assert(rejected[0].evidence.some((e) => e.kind === "historical-artifact-rejection" && e.value === process.argv[2]));
            ' "$QUALIFICATION_DIR/$1.json" "$2"
          }
          expect_clean_fixture() {
            node "$cli" check documentation.local-references --consumer "$FOUNDATION_PROBE_DIR" --json > "$QUALIFICATION_DIR/$1.json"
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync(process.argv[1]));
              assert.equal(report.outcome, "passed");
              assert.deepEqual(report.summary, { errors: 0, warnings: 0, infos: 21 });
            ' "$QUALIFICATION_DIR/$1.json"
          }

          printf '\n' >> "$FOUNDATION_PROBE_DIR/$artifact"
          expect_violation negative-byte-drift
          expect_historical_rejection negative-byte-drift source-digest-mismatch
          cp "$artifact" "$FOUNDATION_PROBE_DIR/$artifact"
          expect_clean_fixture restored-byte-drift

          test "$(grep -c '^      - kind: link$' "$policy")" -eq 21
          sed '0,/^      - kind: link$/{
            /^      - kind: link$/{
              N
              N
              N
              d
            }
          }' "$policy" > "$FOUNDATION_PROBE_DIR/$policy"
          test "$(grep -c '^      - kind: link$' "$FOUNDATION_PROBE_DIR/$policy")" -eq 20
          expect_violation negative-incomplete-inventory
          expect_historical_rejection negative-incomplete-inventory reference-set-mismatch
          cp "$policy" "$FOUNDATION_PROBE_DIR/$policy"
          expect_clean_fixture restored-inventory

          probe_doc="$FOUNDATION_PROBE_DIR/docs/foundation-markdown-negative-probe.md"
          test ! -e "$probe_doc"
          test ! -e "$FOUNDATION_PROBE_DIR/docs/__foundation_missing_probe__.md"
          printf '# Probe\n\n[Missing](./__foundation_missing_probe__.md)\n' > "$probe_doc"
          expect_violation negative-ordinary-link
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1]));
            assert.equal(report.outcome, "violations");
            assert.deepEqual(report.summary, { errors: 1, warnings: 0, infos: 21 });
            const diagnostics = report.capabilities.flatMap((c) => c.diagnostics);
            assert.equal(diagnostics.filter((d) => d.ruleId === "documentation.local-references.broken-link" && d.location.path === "docs/foundation-markdown-negative-probe.md").length, 1);
            assert.equal(diagnostics.filter((d) => d.ruleId === "documentation.local-references.historical-absolute-reference").length, 21);
          ' "$QUALIFICATION_DIR/negative-ordinary-link.json"
          rm "$probe_doc"
          expect_clean_fixture restored-all-probes
          cmp "$artifact" "$FOUNDATION_PROBE_DIR/$artifact"
          cmp "$policy" "$FOUNDATION_PROBE_DIR/$policy"
          printf '%s  %s\n' "$artifact_digest" "$artifact" | sha256sum -c -
      - name: Run the focused integrity tests with the native load guard
        env:
          NODE_OPTIONS: --max-old-space-size=1024 --import=${{ github.workspace }}/scripts/local-checks/lint-format-native-load-guard.ts
          REVIEWROUTER_NATIVE_FORMAT_AUDIT: ${{ runner.temp }}/foundation-markdown/tests-native-audit.ndjson
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run --no-file-parallelism --maxWorkers=1 --reporter=json --outputFile="$QUALIFICATION_DIR/focused-tests.json" scripts/install-private-dependencies.test.ts scripts/promote-private-pg17-activation-catalog-policy.test.ts
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1]));
            assert.equal(report.success, true);
            assert.equal(report.numTotalTests, 52);
            assert.equal(report.numPassedTests, 52);
            assert.equal(report.numFailedTests, 0);
            assert.equal(report.numPendingTests, 0);
          ' "$QUALIFICATION_DIR/focused-tests.json"
      - name: Check the complete adoption delta format and tracked-byte integrity
        env:
          NODE_OPTIONS: --max-old-space-size=1024 --import=${{ github.workspace }}/scripts/local-checks/lint-format-native-load-guard.ts
          REVIEWROUTER_NATIVE_FORMAT_AUDIT: ${{ runner.temp }}/foundation-markdown/format-native-audit.ndjson
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --check package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/install-private-dependencies.mjs foundation.config.yaml architecture/foundation/documentation-local-references.yaml architecture/foundation/README.md ai-docs/architecture/84-foundation-default-adoption.md ai-docs/design/archive/README.md ai-docs/design/memory/README.md
          cmp pnpm-lock.yaml "$QUALIFICATION_DIR/pnpm-lock.yaml"
          git diff --exit-code -- . ':!pnpm-lock.yaml'
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-markdown-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/foundation-markdown/
          retention-days: 7
          if-no-files-found: error
