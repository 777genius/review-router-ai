name: ReviewRouter V8.2 — native video and visual QA
on:
  push:
    branches:
      - feat/reviewrouter-video-v7
    paths:
      - "artifacts/reviewrouter-video/**"
      - ".github/workflows/reviewrouter-video-v7-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-v82:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/reviewrouter-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artifacts/reviewrouter-video/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare original product fonts and synthesized SFX
        run: npm run prepare:v7
      - name: Type-check all compositions
        run: npx tsc --noEmit
      - name: Prepare QA stills
        run: |
          mkdir -p out/qa
          npx remotion still src/index.ts ReviewRouterV82 out/qa/01-hero.png --frame=72 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/02-github.png --frame=141 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/03-providers.png --frame=238 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/04-repositories.png --frame=385 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/05-comment-first.png --frame=464 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/06-comments-stack.png --frame=534 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/07-mcp-tools.png --frame=658 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/08-review-skills.png --frame=768 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/09-incremental.png --frame=865 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/10-insights.png --frame=992 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/11-benchmark.png --frame=1093 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV82 out/qa/12-outro.png --frame=1195 --concurrency=2
      - name: Render entire 41.43-second V8.2
        run: npm run render:v82
      - name: Ensure ffprobe is available for media validation
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Decode and assert MP4/audio properties
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,width,height,avg_frame_rate -of json out/reviewrouter-v82.mp4
          ffmpeg -v error -i out/reviewrouter-v82.mp4 -f null -
          node scripts/check-v8-media.mjs out/reviewrouter-v82.mp4 1243
      - name: Upload full native video and QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewrouter-v82-native-video
          path: |
            artifacts/reviewrouter-video/out/reviewrouter-v82.mp4
            artifacts/reviewrouter-video/out/qa/*.png
          retention-days: 14
          if-no-files-found: warn
