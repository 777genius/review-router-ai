name: ReviewRouter V7 Lite native video render
on:
  push:
    branches:
      - feat/reviewrouter-video-v7
    paths:
      - "artifacts/reviewrouter-video/**"
      - ".github/workflows/reviewrouter-video-v7-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/reviewrouter-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artifacts/reviewrouter-video/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare authentic font and original audio cues
        run: npm run prepare:v7
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Verify selected frames
        run: |
          mkdir -p out/qa
          npx remotion still src/index.ts ReviewRouterV7Lite out/qa/entry.png --frame=45 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV7Lite out/qa/providers.png --frame=331 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV7Lite out/qa/repository.png --frame=495 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV7Lite out/qa/finding.png --frame=630 --concurrency=2
          npx remotion still src/index.ts ReviewRouterV7Lite out/qa/benchmark.png --frame=879 --concurrency=2
      - name: Render Lite motion proof
        run: npm run render:v7-lite-proof
      - name: Render full Lite MP4 1920x1080 30fps
        run: npm run render:v7-lite
      - name: Inspect video and audio streams
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,width,height,avg_frame_rate -of json out/reviewrouter-v7-lite.mp4
          ffmpeg -v error -i out/reviewrouter-v7-lite.mp4 -f null -
      - name: Upload native MP4, proof and stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewrouter-v7-lite-native
          path: |
            artifacts/reviewrouter-video/out/reviewrouter-v7-lite.mp4
            artifacts/reviewrouter-video/out/reviewrouter-v7-lite-proof.mp4
            artifacts/reviewrouter-video/out/qa/*.png
          if-no-files-found: warn
          retention-days: 14
