name: Cold adoption native qualification

on:
  push:
    branches:
      - qualification/cold-adoption-hci-preflight-20261128

permissions:
  contents: read

concurrency:
  group: cold-adoption-hci-preflight-20261128
  cancel-in-progress: true

env:
  NODE_VERSION: "26.11.1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  AUTH_SECRET: ci-auth-secret-not-used-for-production
  AUTH_TRUST_HOST: "true"
  GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-used-for-production
  REVIEW_ROUTER_WEB_URL: http://localhost:3000
  REVIEW_ROUTER_PUBLIC_WEB_URL: https://web.reviewrouter.test
  REVIEW_ROUTER_API_URL: http://localhost:4000
  REVIEW_ROUTER_PUBLIC_API_URL: https://api.reviewrouter.test
  REVIEW_ROUTER_ACTION_REF: 777genius/review-router@main
  REVIEW_ROUTER_ACTION_VERSION: main
  REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: 777genius/review-router@66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
  REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS: ""
  # Public test fixture only; production uses one secret-manager value shared
  # by every database writer.
  REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ci_database_recovery_witness_not_for_production_000000000000
  REVIEW_ROUTER_DEFAULT_MODEL: gpt-5.5
  REVIEW_ROUTER_DEFAULT_EFFORT: xhigh
  REVIEW_ROUTER_PAIRED_ACTION_REF: 1ce5d0abc8300d024ec75c556df1ebbb41c3cbe7
  REVIEW_ROUTER_HOSTED_POOL_ACTION_TAG: v1.0.171
  REVIEW_ROUTER_HOSTED_POOL_ACTION_SHA: 66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
  REVIEW_ROUTER_HOSTED_POOL_ACTION_DIST_SHA256: 2a65907ac8474f805dcb23358618c9c673e6a903bf1c3c26fcdf4cfe02debe2a
  REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS: "0"
  REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "0"
  REVIEW_ROUTER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
  REVIEW_ROUTER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore


jobs:
  native:
    name: Native format, types and progress regressions
    if: ${{ github.repository == '777genius/review-router-ai' && github.actor == '777genius' }}
    runs-on: ${{ vars.CI_STATIC_CHECKS_RUNNER || vars.CI_LINUX_CHECKS_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout immutable progress correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e40b74843bf92b295f1c16b39290aec42d7825b
          fetch-depth: 0
          persist-credentials: false


      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.11.1"


      - name: Bind exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1e40b74843bf92b295f1c16b39290aec42d7825b
          test "$(git rev-parse HEAD^{tree})" = c7befd2b0fac5be06c588f995058e36fc23b2f25
          test "$(git hash-object apps/api/src/gateway-multi-reviewers-paired.e2e.test.ts)" = f9a4c914256babe208270730c7bcb55006ef3a5e
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.ts)" = 221ffcd2e5af465767745a3ef628c568c9c7bee5
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.test.ts)" = 32d4374087f626de4f52ef3d4af165930679ddc3
          test "$(git hash-object scripts/review-action-v2-production-e2e/review-action-v2-production.e2e.test.ts)" = 837db91c878d86bbc8ded03b4041b2eaf3ee2738
          mkdir -p tmp/cold-adoption-native
          git log -1 --format='%H %T' > tmp/cold-adoption-native/source.txt
          node --version >> tmp/cold-adoption-native/source.txt


      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7


      - name: Install frozen source dependencies
        id: install
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile


      - name: Generate offline Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs


      - name: Bootstrap native contract sources
        id: bootstrap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/check-review-action-v2-protocol.mjs --bootstrap-only
          pnpm --filter @reviewrouter/protocol-review-action-v2 build
          node scripts/rewrite-dist-esm-imports.mjs


      - name: Check native formatting of the three changed files
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/local-checks/lint-format-native-load-guard.ts
          REVIEWROUTER_NATIVE_FORMAT_AUDIT: ${{ runner.temp }}/cold-adoption-native-format.jsonl
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --check \
            packages/features/review-progress/src/domain/review-progress.ts \
            packages/features/review-progress/src/domain/review-progress.test.ts \
            scripts/review-action-v2-production-e2e/review-action-v2-production.e2e.test.ts


      - name: Preserve canonical native formatter output for any mismatched file
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.format.outcome == 'failure' }}
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/local-checks/lint-format-native-load-guard.ts
          REVIEWROUTER_NATIVE_FORMAT_AUDIT: ${{ runner.temp }}/cold-adoption-native-format.jsonl
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const paths = [
            'packages/features/review-progress/src/domain/review-progress.ts',
            'packages/features/review-progress/src/domain/review-progress.test.ts',
            'scripts/review-action-v2-production-e2e/review-action-v2-production.e2e.test.ts',
          ];
          const gitBlob = bytes => createHash('sha1').update(Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])).digest('hex');
          mkdirSync('tmp/cold-adoption-native/canonical', { recursive: true });
          for (const [index, path] of paths.entries()) {
            const original = readFileSync(path);
            const result = spawnSync('pnpm', ['exec', 'prettier', path], { encoding: null, env: process.env, maxBuffer: 8 * 1024 * 1024 });
            assert.equal(result.status, 0);
            const again = spawnSync('pnpm', ['exec', 'prettier', '--stdin-filepath', path], { input: result.stdout, encoding: null, env: process.env, maxBuffer: 8 * 1024 * 1024 });
            assert.equal(again.status, 0);
            assert(result.stdout.equals(again.stdout), 'native formatter is not idempotent');
            const changed = !original.equals(result.stdout);
            const receipt = { path, originalGitBlob: gitBlob(original), canonicalGitBlob: gitBlob(result.stdout), changed };
            if (changed) {
              receipt.canonicalBase64 = result.stdout.toString('base64');
              writeFileSync('tmp/cold-adoption-native/canonical/' + index + '.ts', result.stdout);
            }
            console.log('NATIVE_CANONICAL_FILE ' + JSON.stringify(receipt));
          }
          NODE

      - name: Check owning progress and API types
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @reviewrouter/features-review-progress typecheck
          pnpm --filter @reviewrouter/api typecheck


      - name: Run complete progress domain regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --configLoader native --maxWorkers=1 \
            packages/features/review-progress/src/domain/review-progress.test.ts \
            --reporter=default --reporter=json \
            --outputFile=tmp/cold-adoption-native/domain-results.json \
            2>&1 | tee tmp/cold-adoption-native/domain.log


      - name: Verify source stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git hash-object apps/api/src/gateway-multi-reviewers-paired.e2e.test.ts)" = f9a4c914256babe208270730c7bcb55006ef3a5e
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.ts)" = 221ffcd2e5af465767745a3ef628c568c9c7bee5
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.test.ts)" = 32d4374087f626de4f52ef3d4af165930679ddc3
          test "$(git hash-object scripts/review-action-v2-production-e2e/review-action-v2-production.e2e.test.ts)" = 837db91c878d86bbc8ded03b4041b2eaf3ee2738


      - name: Preserve exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-adoption-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/cold-adoption-native/
            ${{ runner.temp }}/cold-adoption-native-format.jsonl
          if-no-files-found: error
          retention-days: 14

