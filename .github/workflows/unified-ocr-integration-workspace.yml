# Temporary exact-parent qualification; no branch, tag or deployment writes.
name: Unified OCR integration workspace
on:
  push:
    branches: [feat/unified-ocr-review-20261026]
    paths: [.github/workflows/unified-ocr-integration-workspace.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      MAIN_SHA: 89ce21cccbd5e979baf46450ecb8bb5b1b599e90
      DATABASE_URL: postgresql://fixture_owner:synthetic-fixture-password@127.0.0.1:5432/review_router_test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Integrate the reviewed exact parents
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 777genius/review-router-ai
          test "$GITHUB_REF" = refs/heads/feat/unified-ocr-review-20261026
          git config user.name 777genius
          git config user.email iliyazelenkog@gmail.com
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$MAIN_SHA")" = d3595c2e3e0b21ab539dea0fb7a06d35a4613faf
          git show 62c3d8f2235c94c4168cbd10a2ee191af13764b1:.github/ocr-recovery/merge-control.py > "$RUNNER_TEMP/ocr-merge.py"
          git merge --no-commit --no-ff "$MAIN_SHA" || test -n "$(git ls-files -u)"
          python3 "$RUNNER_TEMP/ocr-merge.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/rehearse-private-pg17-rollout.test.ts'); text = p.read_text()
          anchor = 'repositorySecretProfilesMigrationNames.filter('
          assert anchor in text and 'const repositorySecretProfilesMigrationNames' not in text
          p.write_text(text.replace(anchor, 'currentMigrationNames.filter('))
          p = Path('scripts/lib/render-schema-handoff-policy.test.ts'); text = p.read_text()
          anchor = '.filter((name) => name !== "000136_provider_usage"))'
          assert anchor in text
          p.write_text(text.replace(anchor, '.filter((name) => name !== "000136_provider_usage" && name !== unifiedModelDispatchMigrationName))'))
          p = Path('ai-docs/deployments/README.md'); text = p.read_text()
          anchor = '\nThe task file is authoritative;'
          assert anchor in text and '2026-10-29-unified-ocr.md' not in text
          row = '| [Unified OCR and verification](2026-10-29-unified-ocr.md) | [PR #718](https://github.com/777genius/review-router-ai/pull/718), [Action #346](https://github.com/777genius/review-router/pull/346) | `pending` | `pending` | Exact-pair qualification, release registration, installed-caller transition, live provider/App checks and fleet witness. |\n'
          p.write_text(text.replace(anchor, row + anchor))
          PY
          test -z "$(git ls-files -u)"
          mkdir -p "$RUNNER_TEMP/ocr-integration"
      - name: Install the existing locked dependency graph
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm compiler:prepare
          pnpm --filter @reviewrouter/platform-db db:generate
      - name: Format only integration resolutions
        run: |
          pnpm exec prettier --write \
            apps/api/src/review-action-v2-production-composition.ts apps/api/src/review-run-runtime-snapshot.ts \
            apps/web/app/dashboard/repository-setup-optimistic-status.tsx apps/web/app/dashboard/repository-setup-progress-panel.tsx \
            packages/features/review-run-control/src/domain/review-run-runtime-snapshot.ts packages/features/review-run-control/src/tests/review-agent-profile.test.ts \
            packages/features/release-rollout/src/domain/release-migration-transition.test.ts \
            scripts/check-architecture-boundaries.mjs scripts/check-architecture-boundaries.test.ts \
            scripts/accounts-reference-e2e/src/contracts.ts scripts/accounts-reference-e2e/src/run.ts \
            scripts/lib/render-schema-handoff-policy.mjs scripts/lib/render-schema-handoff-policy.test.ts \
            scripts/lib/render-schema-handoff-transaction.test.ts scripts/lib/render-historical96-checkout.mjs \
            scripts/lib/render-historical96-checkout.test.ts scripts/lib/provider-key-checkout-admission.test.ts \
            scripts/codex-rotating-release-migration-workflow.test.ts scripts/rehearse-private-pg17-rollout.mjs \
            scripts/rehearse-private-pg17-rollout.test.ts ai-docs/deployments/README.md
      - name: Check architecture and reproducible contracts
        run: |
          pnpm architecture:check
          pnpm protocol:check
      - name: Rebuild the curated runtime bundles
        run: pnpm action:build
      - name: Check integrated production types
        run: |
          pnpm --filter @reviewrouter/features-review-run-control typecheck
          pnpm --filter @reviewrouter/features-action-control-plane typecheck
          pnpm --filter @reviewrouter/api typecheck
          pnpm --filter @reviewrouter/web typecheck
      - name: Run integration and recovery regressions
        run: |
          pnpm exec vitest run \
            scripts/check-architecture-boundaries.test.ts packages/features/review-run-control/src/tests \
            apps/api/src/review-run-runtime-snapshot.test.ts \
            apps/web/app/dashboard/repository-setup-optimistic-status.test.tsx apps/web/app/dashboard/repository-setup-progress-panel.test.tsx \
            apps/web/src/server/codex-runtime-migration-github.test.ts \
            apps/worker/src/review-v2-dispatch-cleanup-handler.test.ts apps/worker/src/review-v2-intent-dispatcher.test.ts \
            packages/features/release-rollout/src/domain/release-migration-transition.test.ts \
            scripts/codex-rotating-release-migration-workflow.test.ts scripts/lib/provider-key-checkout-admission.test.ts \
            scripts/lib/render-historical96-checkout.test.ts scripts/lib/render-schema-handoff-policy.test.ts \
            scripts/lib/render-schema-handoff-transaction.test.ts scripts/rehearse-private-pg17-rollout.test.ts \
            --maxWorkers=2 --no-file-parallelism --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/ocr-integration/results.json"
      - name: Preserve verified blob objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo, head, main = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], os.environ['MAIN_SHA']
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'ocr-integration')
          def git(*args): return subprocess.check_output(['git', *args])
          def api(path, body=None):
              args = ['gh', 'api', f'repos/{repo}/{path}']
              if body is not None: args += ['--method', 'POST', '--input', '-']
              r = subprocess.run(args, input=None if body is None else json.dumps(body).encode(), stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if r.returncode: raise RuntimeError(f'Blob preservation failed: {path}: {r.stderr.decode()[:500]}')
              return json.loads(r.stdout)
          assert repo == '777genius/review-router-ai'
          assert git('rev-parse', 'HEAD').decode().strip() == head
          assert git('rev-parse', 'MERGE_HEAD').decode().strip() == main
          assert api('git/ref/heads/feat/unified-ocr-review-20261026')['object']['sha'] == head
          pathlib.Path('.github/workflows/unified-ocr-integration-workspace.yml').unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check', main], check=True)
          assert not git('ls-files', '-u')
          tree = git('write-tree').decode().strip()
          def entries(ref):
              rows = {}
              for row in git('ls-tree', '-rz', ref).split(b'\0'):
                  if not row: continue
                  info, name = row.split(b'\t', 1)
                  mode, kind, sha = info.decode().split()
                  rows[name.decode()] = {'mode': mode, 'type': kind, 'sha': sha}
              return rows
          feature, base, result = entries(head), entries(main), entries(tree)
          known = {entry['sha'] for entry in [*feature.values(), *base.values()]}
          delta = []
          for name in sorted(base.keys() | result.keys()):
              if base.get(name) == result.get(name): continue
              if name not in result:
                  delta.append({'path': name, 'mode': base[name]['mode'], 'type': base[name]['type'], 'sha': None})
                  continue
              entry = result[name]
              if entry['sha'] not in known:
                  assert entry['type'] == 'blob'
                  raw = git('cat-file', 'blob', entry['sha'])
                  assert api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(raw).decode()})['sha'] == entry['sha']
                  known.add(entry['sha'])
              delta.append({'path': name, **entry})
          proof = {'head': head, 'main': main, 'base_tree': git('rev-parse', f'{main}^{{tree}}').decode().strip(), 'tree': tree, 'tree_elements': delta, 'run_id': os.environ['GITHUB_RUN_ID']}
          (out/'candidate.json').write_text(json.dumps(proof, indent=2))
          (out/'source.patch').write_bytes(git('diff', '--cached', '--binary', main))
          print(json.dumps({k:v for k,v in proof.items() if k != 'tree_elements'}))
          print('Changed files:', len(delta), 'No tree, commit, ref, release or deployment writes.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-ocr-integration-${{ github.sha }}
          path: ${{ runner.temp }}/ocr-integration/
          retention-days: 3
          if-no-files-found: warn
