name: Temporary landing formatting evidence
on:
  push:
    branches:
      - feat/landing-visual-motion-20261114
    paths:
      - .github/workflows/landing-format-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Format isolated changed landing files
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund prettier@3.8.3
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const paths = [
          "ai-docs/design/landing-reactbits-motion-plan.md",
          "apps/web/app/getting-started/page.tsx",
          "apps/web/app/home-faq.tsx",
          "apps/web/app/home-features.tsx",
          "apps/web/app/home-final-cta.tsx",
          "apps/web/app/home-hero.tsx",
          "apps/web/app/home-landing.css",
          "apps/web/app/home-landing.test.tsx",
          "apps/web/app/home-visual-preview.test.tsx",
          "apps/web/app/home-visual-preview.tsx",
          "apps/web/app/layout.tsx",
          "apps/web/app/opengraph-image.tsx",
          "apps/web/app/page.tsx",
          "apps/web/app/primary-nav.tsx",
          "apps/web/app/security/page.tsx",
          "scripts/check-hosted-web.mjs",
          "scripts/check-web-pages.mjs",
          ];
          execFileSync("prettier", ["--write",...paths],{stdio:"inherit",maxBuffer:8*1024*1024});
          for (const path of paths) {
            const content=fs.readFileSync(path);
            process.stdout.write("FORMAT_FILE|" + path + "|" + content.toString("base64") + "\n");
          }
          NODE
