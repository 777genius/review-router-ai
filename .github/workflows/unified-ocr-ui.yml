name: Unified OCR acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/unified-ocr-ui.yml
      - .github/workflows/ci.yml
      - apps/api/**
      - apps/web/**
      - apps/worker/**
      - packages/features/action-control-plane/**
      - packages/features/provider-setup/**
      - packages/features/review-config/**
      - packages/features/review-executions/**
      - packages/features/review-publishing/**
      - packages/features/review-run-control/**
      - packages/platform/db/**
      - packages/shared/**
      - scripts/accounts-reference-e2e/**
      - scripts/rewrite-dist-esm-imports.mjs
      - scripts/review-investigation-paired-e2e/**
      - scripts/review-action-v2-production-e2e/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: unified-ocr-ui-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-next-readiness:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Actual Next UI and OCR lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: fixture_owner
          POSTGRES_PASSWORD: synthetic-fixture-password
          POSTGRES_DB: review_router_accounts_reference_e2e_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture_owner -d review_router_accounts_reference_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials only. No repository secrets or live identities.
      DATABASE_URL: postgresql://fixture_owner:synthetic-fixture-password@127.0.0.1:5432/review_router_accounts_reference_e2e_test?schema=public
      ACCOUNTS_REFERENCE_E2E_TEST_DATABASE_URL: postgresql://fixture_owner:synthetic-fixture-password@127.0.0.1:5432/review_router_accounts_reference_e2e_test?schema=public
      ACCOUNTS_REFERENCE_E2E_GREP: review runtime readiness|Memory confirmation settings
      ACCOUNTS_REFERENCE_E2E_TRACE: "on"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/accounts-reference-e2e/browser-cache
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Exact release checking reads the historical canonical S2 handoff.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Install the locked application and browser harness
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm --dir scripts/accounts-reference-e2e install --frozen-lockfile
          pnpm --filter @reviewrouter/platform-db db:generate
          pnpm --dir scripts/accounts-reference-e2e run check
      - name: Build shared release-contract helpers
        run: |
          pnpm --filter @reviewrouter/shared build
          node scripts/rewrite-dist-esm-imports.mjs
      - name: Install Chromium with its supported system libraries
        run: pnpm --dir scripts/accounts-reference-e2e exec playwright install --with-deps chromium
      - name: Migrate fresh PostgreSQL and run actual desktop and mobile Next UI
        run: |
          node --import ./scripts/accounts-reference-e2e/node_modules/tsx/dist/loader.mjs \
            scripts/accounts-reference-e2e/src/run.ts \
            --repo-root "$PWD" \
            --database-url "$ACCOUNTS_REFERENCE_E2E_TEST_DATABASE_URL" \
            --expected-revision "$GITHUB_SHA" \
            --work-dir "$PWD/tmp/accounts-reference-e2e/runs/unified-ocr-ui" \
            --review-runtime-fixture --catalog-fixture
      - name: Read the canonical paired Action pin
        id: paired-action
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const source = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          const matches = [...source.matchAll(/^  REVIEW_ROUTER_PAIRED_ACTION_REF: ([a-f0-9]{40})$/gm)];
          if (matches.length !== 1) throw new Error('paired_action_immutable_ref_required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ref=${matches[0][1]}\n`);
          JS
      - name: Check out the exact paired Review Action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: 777genius/review-router
          ref: ${{ steps.paired-action.outputs.ref }}
          # Verify ancestry from the immutable handoff base as well as HEAD.
          fetch-depth: 0
          path: .paired/review-router-action
          persist-credentials: false
      - name: Install the paired Action's locked dependencies
        env:
          EXPECTED_PAIRED_ACTION_REF: ${{ steps.paired-action.outputs.ref }}
        run: |
          test "$(git -C .paired/review-router-action rev-parse HEAD)" = "$EXPECTED_PAIRED_ACTION_REF"
          npm ci --ignore-scripts --prefix .paired/review-router-action
      - name: Set up pinned Go for the paired OCR executable
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: false
      - name: Build and verify the exact paired OCR executable
        working-directory: .paired/review-router-action
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          tools/ocr/build.sh --out "$RUNNER_TEMP/reviewrouter-paired-ocr"
          diff -u tools/ocr/qualifications/unified-model-routes-v3.manifest "$RUNNER_TEMP/reviewrouter-paired-ocr/MANIFEST"
          node <<'JS'
          const fs = require('node:fs');
          const manifest = fs.readFileSync('tools/ocr/qualifications/unified-model-routes-v3.manifest', 'utf8');
          const profiles = JSON.parse(fs.readFileSync('src/control-plane/review-agent-profiles.json', 'utf8'))
            .filter((profile) => profile.profileRef === 'ocr-managed-v5');
          const profile = profiles[0];
          if (profiles.length !== 1 || profile.agentKind !== 'ocr' ||
              profile.packageVersion !== manifest.match(/^release_version=(.+)$/m)?.[1] ||
              profile.binarySha256 !== manifest.match(/^binary_sha256=([a-f0-9]{64})$/m)?.[1] ||
              [...profile.modelTransports].sort().join(',') !== 'account_gateway,provider_api') {
            throw new Error('paired_ocr_profile_receipt_mismatch');
          }
          JS
      - name: Run the paired review lifecycle and actual production runner
        env:
          REVIEW_ROUTER_REVIEW_INVESTIGATION_PAIRED_E2E: "1"
          REVIEW_ROUTER_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          REVIEW_ROUTER_ACTION_SOURCE_DIR: ${{ github.workspace }}/.paired/review-router-action
          REVIEW_ROUTER_PAIRED_OCR_BINARY: ${{ runner.temp }}/reviewrouter-paired-ocr/opencodereview
        run: |
          pnpm exec vitest run scripts/review-investigation-paired-e2e/lifecycle-verification-paired.e2e.test.ts \
            --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json \
            --outputFile.json=tmp/accounts-reference-e2e/runs/unified-ocr-ui/paired-lifecycle-result.json
      - name: Preserve screenshots, traces and bounded fixture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-ocr-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/accounts-reference-e2e/runs/unified-ocr-ui/
          if-no-files-found: warn
          retention-days: 7
