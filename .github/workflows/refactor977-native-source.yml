name: PR 977 isolated native source qualification

on:
  push:
    branches:
      - refactor/architecture-boundaries-phase2-20261123
    paths:
      - .github/workflows/refactor977-native-source.yml
      - packages/features/workflow-provisioning/src/**
      - packages/features/review-context-attestation/src/domain/gateway-session-configuration.ts
      - packages/features/review-context-attestation/src/tests/gateway-session-configuration.test.ts
      - scripts/check-architecture-boundaries*
      - scripts/lib/module-import-specifiers.ts
      - apps/web/app/dashboard/actions*
      - eslint.config.mjs
      - tsconfig.tooling.json

permissions:
  contents: read

concurrency:
  group: refactor977-native-source
  cancel-in-progress: true

jobs:
  pure-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NATIVE_QUALIFICATION_ROOT: ${{ runner.temp }}/reviewrouter-977-pure
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.11.1"
      - name: Prepare isolated native compiler and test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$NATIVE_QUALIFICATION_ROOT"
          cat > "$NATIVE_QUALIFICATION_ROOT/package.json" <<'JSON'
          {
            "name": "reviewrouter-phase2-pure-qualification",
            "private": true,
            "type": "module",
            "devDependencies": {
              "@types/node": "22.19.17",
              "oxfmt": "0.72.0",
              "typescript": "7.0.2",
              "vitest": "4.1.10"
            }
          }
          JSON
          npm install --prefix "$NATIVE_QUALIFICATION_ROOT" --ignore-scripts --no-audit --no-fund
          test "$(jq -r '.version' "$NATIVE_QUALIFICATION_ROOT/node_modules/typescript/package.json")" = "7.0.2"
          npm ls --prefix "$NATIVE_QUALIFICATION_ROOT" typescript --all --json > "$NATIVE_QUALIFICATION_ROOT/typescript-tree.json"
          jq -e '[.. | objects | select(has("typescript")) | .typescript.version] | unique == ["7.0.2"]' "$NATIVE_QUALIFICATION_ROOT/typescript-tree.json"
          "$NATIVE_QUALIFICATION_ROOT/node_modules/.bin/tsc" --version
      - name: Copy exact pure sources and independent existing tests
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            packages/features/workflow-provisioning/src/domain/workflow-setup-authority.ts
            packages/features/workflow-provisioning/src/domain/setup-pull-request-head.ts
            packages/features/workflow-provisioning/src/domain/managed-workflow-setup-options.ts
            packages/features/workflow-provisioning/src/application/ports/current-workflow-setup-query-port.ts
            packages/features/workflow-provisioning/src/application/use-cases/assert-current-workflow-setup.ts
            packages/features/workflow-provisioning/src/tests/assert-current-workflow-setup.test.ts
            packages/features/workflow-provisioning/src/tests/workflow-setup-authority.test.ts
            packages/features/workflow-provisioning/src/tests/setup-pull-request-head.test.ts
            packages/features/workflow-provisioning/src/tests/managed-workflow-setup-options.test.ts
            packages/features/review-context-attestation/src/domain/gateway-session-configuration.ts
            packages/features/review-context-attestation/src/tests/gateway-session-configuration.test.ts
          )
          for path in "${sources[@]}"; do
            cp --parents "$path" "$NATIVE_QUALIFICATION_ROOT"
            cmp "$path" "$NATIVE_QUALIFICATION_ROOT/$path"
          done
          printf 'qualified_source=%s\n' "$GITHUB_SHA"
          sha256sum "${sources[@]}"
          cat > "$NATIVE_QUALIFICATION_ROOT/vitest.config.ts" <<'TS'
          export default { test: { include: ["packages/**/*.test.ts"] } };
          TS
          cat > "$NATIVE_QUALIFICATION_ROOT/tsconfig.json" <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["node"]
            },
            "files": [
              "packages/features/workflow-provisioning/src/domain/workflow-setup-authority.ts",
              "packages/features/workflow-provisioning/src/domain/setup-pull-request-head.ts",
              "packages/features/workflow-provisioning/src/application/ports/current-workflow-setup-query-port.ts",
              "packages/features/workflow-provisioning/src/application/use-cases/assert-current-workflow-setup.ts",
              "packages/features/workflow-provisioning/src/tests/assert-current-workflow-setup.test.ts",
              "packages/features/workflow-provisioning/src/tests/workflow-setup-authority.test.ts",
              "packages/features/workflow-provisioning/src/tests/setup-pull-request-head.test.ts",
              "packages/features/review-context-attestation/src/domain/gateway-session-configuration.ts",
              "packages/features/review-context-attestation/src/tests/gateway-session-configuration.test.ts"
            ]
          }
          JSON
      - name: Strict native TypeScript 7 checks for the isolated owner slice
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_QUALIFICATION_ROOT/node_modules/.bin/tsc" -p "$NATIVE_QUALIFICATION_ROOT/tsconfig.json"
      - name: Execute all five pure policy and application suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$NATIVE_QUALIFICATION_ROOT"
          ./node_modules/.bin/vitest run --config vitest.config.ts
      - name: Show focused Rust formatter differences without legacy parser fallback
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          formatter="$NATIVE_QUALIFICATION_ROOT/node_modules/.bin/oxfmt"
          test -x "$formatter"
          files=(
            apps/web/app/dashboard/actions.ts
            apps/web/app/dashboard/actions-workflow-provisioning-recovery.test.ts
            eslint.config.mjs
            packages/features/workflow-provisioning/src/domain/managed-workflow-setup-options.ts
            packages/features/workflow-provisioning/src/domain/setup-pull-request-head.ts
            packages/features/workflow-provisioning/src/domain/workflow-setup-authority.ts
            packages/features/workflow-provisioning/src/application/ports/current-workflow-setup-query-port.ts
            packages/features/workflow-provisioning/src/application/use-cases/assert-current-workflow-setup.ts
            packages/features/workflow-provisioning/src/infrastructure/prisma/prisma-current-workflow-setup-query.ts
            packages/features/workflow-provisioning/src/tests/assert-current-workflow-setup.test.ts
            packages/features/workflow-provisioning/src/tests/workflow-setup-authority.test.ts
            packages/features/workflow-provisioning/src/tests/setup-pull-request-head.test.ts
            packages/features/workflow-provisioning/src/tests/managed-workflow-setup-options.test.ts
            packages/features/review-context-attestation/src/domain/gateway-session-configuration.ts
            packages/features/review-context-attestation/src/tests/gateway-session-configuration.test.ts
            scripts/check-architecture-boundaries.mjs
            scripts/check-architecture-boundaries.test.ts
            scripts/lib/module-import-specifiers.ts
            tsconfig.tooling.json
          )
          "$formatter" --write "${files[@]}"
          git diff --check -- "${files[@]}"
          git diff --exit-code -- "${files[@]}"
