# Temporary integration check; removed from the validated candidate tree.
name: Unified OCR integration recovery
on:
  push:
    branches: [feat/unified-ocr-review-20261026]
    paths:
      - .github/workflows/unified-ocr-recovery-snapshot.yml
      - .github/ocr-recovery/**
permissions:
  contents: write
concurrency:
  group: unified-ocr-integration-recovery
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://fixture_owner:synthetic-fixture-password@127.0.0.1:5432/review_router_test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Integrate exact main with reviewed resolutions
        run: |
          set -euo pipefail
          git config user.name 777genius
          git config user.email iliyazelenkog@gmail.com
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD 5551a572fce38aaa3453bbef1ff9af79d3c293de)" = d3595c2e3e0b21ab539dea0fb7a06d35a4613faf
          git merge --no-commit --no-ff 5551a572fce38aaa3453bbef1ff9af79d3c293de || test -n "$(git ls-files -u)"
          python3 .github/ocr-recovery/merge-control.py
          python3 - <<'PY'
          from pathlib import Path
          file = Path('scripts/rehearse-private-pg17-rollout.test.ts')
          text = file.read_text()
          anchor = 'repositorySecretProfilesMigrationNames.filter('
          assert anchor in text and 'const repositorySecretProfilesMigrationNames' not in text
          file.write_text(text.replace(anchor, 'currentMigrationNames.filter('))
          file = Path('scripts/lib/render-schema-handoff-policy.test.ts')
          text = file.read_text()
          anchor = '.filter((name) => name !== "000136_provider_usage"))'
          assert anchor in text
          file.write_text(text.replace(anchor, '.filter((name) => name !== "000136_provider_usage" && name !== unifiedModelDispatchMigrationName))'))
          PY
          test -z "$(git ls-files -u)"
          mkdir -p "$RUNNER_TEMP/ocr-integration"
      - name: Install the existing locked dependency graph
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm compiler:prepare
          pnpm --filter @reviewrouter/platform-db db:generate
      - name: Format only integration resolutions
        run: |
          pnpm exec prettier --write \
            apps/api/src/review-action-v2-production-composition.ts \
            apps/api/src/review-run-runtime-snapshot.ts \
            apps/web/app/dashboard/repository-setup-optimistic-status.tsx \
            apps/web/app/dashboard/repository-setup-progress-panel.tsx \
            packages/features/review-run-control/src/domain/review-run-runtime-snapshot.ts \
            packages/features/review-run-control/src/tests/review-agent-profile.test.ts \
            packages/features/release-rollout/src/domain/release-migration-transition.test.ts \
            scripts/check-architecture-boundaries.mjs scripts/check-architecture-boundaries.test.ts \
            scripts/accounts-reference-e2e/src/contracts.ts scripts/accounts-reference-e2e/src/run.ts \
            scripts/lib/render-schema-handoff-policy.mjs scripts/lib/render-schema-handoff-policy.test.ts \
            scripts/lib/render-schema-handoff-transaction.test.ts scripts/lib/render-historical96-checkout.mjs \
            scripts/lib/render-historical96-checkout.test.ts scripts/lib/provider-key-checkout-admission.test.ts \
            scripts/codex-rotating-release-migration-workflow.test.ts \
            scripts/rehearse-private-pg17-rollout.mjs scripts/rehearse-private-pg17-rollout.test.ts
      - name: Preserve architecture and migration boundaries
        run: pnpm architecture:check
      - id: build
        name: Rebuild existing runtime bundles
        run: pnpm action:build
      - name: Check integration types
        run: |
          pnpm --filter @reviewrouter/features-review-run-control typecheck
          pnpm --filter @reviewrouter/features-action-control-plane typecheck
          pnpm --filter @reviewrouter/api typecheck
          pnpm --filter @reviewrouter/web typecheck
      - name: Verify critical integration regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm exec vitest run \
            scripts/check-architecture-boundaries.test.ts \
            packages/features/review-run-control/src/tests \
            apps/api/src/review-run-runtime-snapshot.test.ts \
            apps/web/app/dashboard/repository-setup-optimistic-status.test.tsx \
            apps/web/app/dashboard/repository-setup-progress-panel.test.tsx \
            apps/web/src/server/codex-runtime-migration-github.test.ts \
            packages/features/release-rollout/src/domain/release-migration-transition.test.ts \
            scripts/codex-rotating-release-migration-workflow.test.ts \
            scripts/lib/provider-key-checkout-admission.test.ts \
            scripts/lib/render-historical96-checkout.test.ts \
            scripts/lib/render-schema-handoff-policy.test.ts \
            scripts/lib/render-schema-handoff-transaction.test.ts \
            scripts/rehearse-private-pg17-rollout.test.ts \
            --maxWorkers=2 --no-file-parallelism --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/ocr-integration/results.json"
      - name: Verify deterministic checked-in protocol
        run: pnpm protocol:check
      - name: Upload the tested merge objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, shutil, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          expected = os.environ['GITHUB_SHA']
          main = '5551a572fce38aaa3453bbef1ff9af79d3c293de'
          assert repo == '777genius/review-router-ai'
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/unified-ocr-review-20261026'
          def git(*args):
              return subprocess.check_output(['git', *args])
          def api(path, body=None):
              args = ['gh', 'api', f'repos/{repo}/{path}']
              if body is not None: args += ['--method', 'POST', '--input', '-']
              completed = subprocess.run(args, input=None if body is None else json.dumps(body).encode(), stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if completed.returncode:
                  raise RuntimeError(f'GitHub object upload failed: {path}: {completed.stderr.decode()[:1000]}')
              return json.loads(completed.stdout)
          assert git('rev-parse', 'HEAD').decode().strip() == expected
          assert git('rev-parse', 'MERGE_HEAD').decode().strip() == main
          assert api('git/ref/heads/feat/unified-ocr-review-20261026')['object']['sha'] == expected
          shutil.rmtree('.github/ocr-recovery')
          pathlib.Path('.github/workflows/unified-ocr-recovery-snapshot.yml').unlink()
          subprocess.run(['git', 'add', '--all'], check=True)
          # Imported vendor patch bytes are unchanged. Check this feature's diff,
          # not whitespace already committed in the main parent.
          subprocess.run(['git', 'diff', '--cached', '--check', main], check=True)
          assert not git('ls-files', '-u')
          tree = git('write-tree').decode().strip()
          print('TESTED_TREE=' + tree, flush=True)
          def entries(ref):
              result = {}
              for entry in git('ls-tree', '-rz', ref).split(b'\0'):
                  if not entry: continue
                  info, name = entry.split(b'\t', 1)
                  mode, kind, sha = info.decode().split()
                  result[name.decode()] = {'mode': mode, 'type': kind, 'sha': sha}
              return result
          before, other, after = entries(expected), entries(main), entries(tree)
          known = {entry['sha'] for entry in [*before.values(), *other.values()]}
          delta = []
          for name in sorted(before.keys() | after.keys()):
              if before.get(name) == after.get(name): continue
              if name not in after:
                  delta.append({'path': name, 'mode': before[name]['mode'], 'type': before[name]['type'], 'sha': None})
                  continue
              entry = after[name]
              if entry['sha'] not in known:
                  assert entry['type'] == 'blob'
                  payload = base64.b64encode(git('cat-file', 'blob', entry['sha'])).decode()
                  assert api('git/blobs', {'encoding': 'base64', 'content': payload})['sha'] == entry['sha']
                  known.add(entry['sha'])
              delta.append({'path': name, **entry})
          remote_tree = api('git/trees', {'base_tree': git('rev-parse', f'{expected}^{{tree}}').decode().strip(), 'tree': delta})['sha']
          assert remote_tree == tree
          author = {'name': '777genius', 'email': 'iliyazelenkog@gmail.com'}
          commit = api('git/commits', {'message': 'merge: integrate current main while preserving unified OCR authority and setup readiness\n\nResolve source conflicts, retain historical migration catalogs, rebuild runtime bundles, and fix migration fixture typing. Qualified by the linked integration run; live provider acceptance remains separate.', 'tree': tree, 'parents': [expected, main], 'author': author, 'committer': author})['sha']
          proof = {'expectedHead': expected, 'main': main, 'tree': tree, 'commit': commit, 'runId': os.environ['GITHUB_RUN_ID']}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ocr-integration', 'candidate.json').write_text(json.dumps(proof, indent=2))
          print('TESTED_CANDIDATE=' + json.dumps(proof))
          PY
      - name: Summarize test evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ['RUNNER_TEMP'], 'ocr-integration', 'results.json')
          if report.exists():
              data = json.loads(report.read_text())
              print({key: data.get(key) for key in ['success','numTotalTests','numPassedTests','numFailedTests','numPendingTests']})
              for suite in data.get('testResults', []):
                  for case in suite.get('assertionResults', []):
                      if case.get('status') == 'failed':
                          print(case.get('fullName'), '\n'.join(case.get('failureMessages', [])))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-ocr-integration-${{ github.sha }}
          path: ${{ runner.temp }}/ocr-integration/
          retention-days: 3
          if-no-files-found: warn
