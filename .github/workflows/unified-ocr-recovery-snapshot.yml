# Temporary read-only recovery aid; remove before this draft is ready to merge.
name: Unified OCR recovery snapshots

on:
  push:
    branches: [feat/unified-ocr-review-20261026]
    paths: [.github/workflows/unified-ocr-recovery-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      matrix:
        include:
          - name: control-base
            repository: 777genius/review-router-ai
            ref: d3595c2e3e0b21ab539dea0fb7a06d35a4613faf
          - name: control-head
            repository: 777genius/review-router-ai
            ref: 476a2e0c400e3b6abde5d33a41557652e78765d0
          - name: control-main
            repository: 777genius/review-router-ai
            ref: 5551a572fce38aaa3453bbef1ff9af79d3c293de
          - name: action-base
            repository: 777genius/review-router
            ref: a8cd9c5818c9c6dd1958e747f89b141a21baf882
          - name: action-head
            repository: 777genius/review-router
            ref: e226a83359b9b0785c17840bfedf8df8669083d3
          - name: action-main
            repository: 777genius/review-router
            ref: main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Archive the exact checked-out tree
        shell: bash
        env:
          SNAPSHOT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocr-recovery"
          git rev-parse HEAD > "$RUNNER_TEMP/ocr-recovery/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/ocr-recovery/tree.txt"
          git archive --format=tar.gz --prefix="$SNAPSHOT_NAME/" HEAD > "$RUNNER_TEMP/ocr-recovery/$SNAPSHOT_NAME.tar.gz"
          cd "$RUNNER_TEMP/ocr-recovery"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-ocr-recovery-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/ocr-recovery/
          retention-days: 1
          if-no-files-found: error
