name: Temporary scoped prettier repair
on:
  push:
    branches:
      - feat/contextual-memory-settings
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce pinned formatting without writing repository
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/features/memory/src/infrastructure/github/github-automatic-memory-source-current.ts
            packages/features/memory/src/tests/github-automatic-memory-source-current.test.ts
            scripts/conversation-evals/score.ts
          )
          for file in "${files[@]}"; do
            mkdir -p "tmp/prettier-repair/before/$(dirname "$file")" "tmp/prettier-repair/after/$(dirname "$file")"
            cp "$file" "tmp/prettier-repair/before/$file"
          done
          npx --yes prettier@3.8.3 --write "${files[@]}"
          for file in "${files[@]}"; do
            cp "$file" "tmp/prettier-repair/after/$file"
            npx --yes prettier@3.8.3 --check "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-prettier-repair
          path: tmp/prettier-repair
          if-no-files-found: error
          retention-days: 2
