name: Temporary conversation source stamp and verifier refresh

on:
  push:
    branches:
      - feat/read-only-inline-explain-20261107
    paths:
      - .github/workflows/temporary-conversation-generated-assets.yml

permissions: {}

jobs:
  regenerate:
    if: ${{ github.repository == '777genius/review-router-ai' && github.ref == 'refs/heads/feat/read-only-inline-explain-20261107' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Setup project Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.11.1'
      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
      - name: Install frozen dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Generate exact source and verifier metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-conversation-source-stamp.ts --write
          node scripts/check-conversation-release-verifier.ts --write
          node scripts/check-conversation-source-stamp.ts --check
          node scripts/check-conversation-release-verifier.ts --check
          git add -- \
            packages/platform/config/src/conversation-source-stamp.json \
            deploy/self-hosted/conversation-verifier.mjs \
            deploy/self-hosted/conversation-verifier.d.mts \
            deploy/self-hosted/conversation-verifier.inputs.json \
            deploy/self-hosted/conversation-verifier.NOTICE
          if git diff --cached --quiet; then
            echo "Generated files already coherent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(conversation): synchronize source stamp and verifier"
          git push origin HEAD:refs/heads/feat/read-only-inline-explain-20261107
