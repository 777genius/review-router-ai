name: Temporary canonical conflict runtime capture
on:
  push:
    branches: [feat/contextual-memory-settings]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == '777genius/review-router-ai'
    runs-on: ${{ vars.CI_LINUX_CHECKS_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - name: Install pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
      - name: Install dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Generate canonical public bundle
        run: |
          node scripts/build-conflict-runtime.ts
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const text = readFileSync('action-dist/conflict-runtime.cjs', 'utf8');
          console.log('RRBUNDLE_BEGIN', text.length);
          for (let index = 0; index < text.length; index += 3000) {
            console.log('RRBUNDLE_CHUNK', index, JSON.stringify(text.slice(index, index + 3000)));
          }
          console.log('RRBUNDLE_END');
          JS
