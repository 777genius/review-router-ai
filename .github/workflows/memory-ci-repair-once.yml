name: Memory browser boot qualification (temporary)

on:
  push:
    branches: [feat/conversational-memory-e2e]
    paths: [.github/workflows/memory-ci-repair-once.yml]

permissions:
  contents: write

concurrency:
  group: memory-ci-repair-once
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == '777genius/review-router-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
      - name: Install pinned dependencies
        run: |
          mkdir -p tmp/memory-browser-repair
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm --dir scripts/accounts-reference-e2e install --ignore-scripts --frozen-lockfile
      - name: Add bounded same-origin script warmup
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: exact replacement must match once')
              p.write_text(text.replace(old, new))
          def create(path, text):
              p = Path(path)
              if p.exists():
                  raise SystemExit(f'{path}: refusing to overwrite')
              p.write_text(text)
          path = 'scripts/accounts-reference-e2e/src/run.ts'
          replace(path,
              'import { seedSkillsFixtures } from "./skills-fixtures.ts";',
              'import { seedSkillsFixtures } from "./skills-fixtures.ts";\nimport { warmNextClientScripts } from "./warm-next-client-scripts.ts";')
          replace(path,
              '    // browser navigation and acceptance assertions retain their own timeouts.\n    for (const [section, ready] of [',
              '    // browser navigation and acceptance assertions retain their own timeouts.\n    const warmedScripts = new Set<string>();\n    for (const [section, ready] of [')
          replace(path,
              '    ] as const) {\n      const response = await fetch(\n        `${appUrl}/dashboard?section=${section}&workspace=rr-e2e-personal-viewer`,\n        {\n          headers: { cookie: viewerCookie },\n          redirect: "manual",\n          signal: AbortSignal.timeout(120_000),\n        },\n      );',
              '    ] as const) {\n      const signal = AbortSignal.timeout(120_000);\n      const response = await fetch(\n        `${appUrl}/dashboard?section=${section}&workspace=rr-e2e-personal-viewer`,\n        {\n          headers: { cookie: viewerCookie },\n          redirect: "manual",\n          signal,\n        },\n      );')
          replace(path,
              '      checks.push(`${section}-authenticated-render-warmed`);',
              '      checks.push(`${section}-authenticated-render-warmed`);\n      await warmNextClientScripts(html, appUrl, signal, warmedScripts);\n      checks.push(`${section}-client-scripts-warmed`);')
          create('scripts/accounts-reference-e2e/src/warm-next-client-scripts.ts', r'''/** Drain the real Next script responses during the existing bounded fixture boot. */
          export async function warmNextClientScripts(
            html: string,
            appUrl: string,
            signal: AbortSignal,
            warmed: Set<string>,
          ): Promise<void> {
            const origin = new URL(appUrl).origin;
            const scripts = [...html.matchAll(/<script\b[^>]*\bsrc="([^"]+)"/gu)];
            if (scripts.length === 0)
              throw new Error("accounts_reference_e2e_client_scripts_missing");
            for (const match of scripts) {
              const source = match[1];
              if (!source)
                throw new Error("accounts_reference_e2e_client_script_invalid");
              const url = new URL(source.replaceAll("&amp;", "&"), appUrl);
              // The fixture never warms external resources or credential-bearing routes.
              if (url.origin !== origin || !url.pathname.startsWith("/_next/static/"))
                throw new Error("accounts_reference_e2e_client_script_outside_fixture");
              if (warmed.has(url.href)) continue;
              const response = await fetch(url, { redirect: "error", signal });
              if (!response.ok)
                throw new Error("accounts_reference_e2e_client_script_unavailable");
              await response.arrayBuffer();
              warmed.add(url.href);
            }
          }
          ''')
          create('scripts/accounts-reference-e2e-warmup.test.ts', r'''import { afterEach, expect, it, vi } from "vitest";
          import { warmNextClientScripts } from "./accounts-reference-e2e/src/warm-next-client-scripts.ts";

          const origin = "http://127.0.0.1:3001";
          const script = '<script src="/_next/static/chunks/main.js?v=1&amp;x=2"></script>';
          afterEach(() => vi.restoreAllMocks());

          it("drains client scripts once, retains the boot deadline and sends no session cookies", async () => {
            const response = new Response("console.log('fixture')");
            const drain = vi.spyOn(response, "arrayBuffer");
            const send = vi.spyOn(globalThis, "fetch").mockResolvedValue(response);
            const signal = AbortSignal.timeout(1_000);
            const warmed = new Set<string>();
            await warmNextClientScripts(script + script, origin, signal, warmed);
            await warmNextClientScripts(script, origin, signal, warmed);
            const url = new URL("/_next/static/chunks/main.js?v=1&x=2", origin);
            expect(send).toHaveBeenCalledTimes(1);
            expect(send).toHaveBeenCalledWith(url, { redirect: "error", signal });
            expect(drain).toHaveBeenCalledOnce();
            expect(warmed).toEqual(new Set([url.href]));
          });

          it.each([
            '<script src="https://outside.example/_next/static/main.js"></script>',
            '<script src="/api/private"></script>',
            "<main>No client script</main>",
          ])("rejects missing or out-of-fixture scripts without network entry: %s", async (html) => {
            const send = vi.spyOn(globalThis, "fetch");
            const warmed = new Set<string>();
            await expect(warmNextClientScripts(html, origin, new AbortController().signal, warmed)).rejects.toThrow(/accounts_reference_e2e_client_script/);
            expect(send).not.toHaveBeenCalled();
            expect(warmed.size).toBe(0);
          });

          it("does not record failed HTTP responses as warmed", async () => {
            vi.spyOn(globalThis, "fetch").mockResolvedValue(new Response("not ready", { status: 503 }));
            const warmed = new Set<string>();
            await expect(warmNextClientScripts(script, origin, new AbortController().signal, warmed)).rejects.toThrow("accounts_reference_e2e_client_script_unavailable");
            expect(warmed.size).toBe(0);
          });

          it("propagates interrupted body reads and never records partial assets", async () => {
            const response = new Response("partial");
            const failure = new DOMException("Boot deadline exceeded", "AbortError");
            vi.spyOn(response, "arrayBuffer").mockRejectedValue(failure);
            vi.spyOn(globalThis, "fetch").mockResolvedValue(response);
            const warmed = new Set<string>();
            await expect(warmNextClientScripts(script, origin, new AbortController().signal, warmed)).rejects.toBe(failure);
            expect(warmed.size).toBe(0);
          });
          ''')
          PY
      - name: Format and qualify exact changes
        run: |
          pnpm exec prettier --write scripts/accounts-reference-e2e/src/run.ts scripts/accounts-reference-e2e/src/warm-next-client-scripts.ts scripts/accounts-reference-e2e-warmup.test.ts
          pnpm exec eslint scripts/accounts-reference-e2e/src/run.ts scripts/accounts-reference-e2e/src/warm-next-client-scripts.ts scripts/accounts-reference-e2e-warmup.test.ts
          pnpm --dir scripts/accounts-reference-e2e run check
          pnpm exec vitest run scripts/accounts-reference-e2e-warmup.test.ts --reporter=default --reporter=json --outputFile=tmp/memory-browser-repair/vitest.json 2>&1 | tee tmp/memory-browser-repair/vitest.log
      - name: Publish bounded fixture fix without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- scripts/accounts-reference-e2e/src/run.ts scripts/accounts-reference-e2e/src/warm-next-client-scripts.ts scripts/accounts-reference-e2e-warmup.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git diff --cached --binary > tmp/memory-browser-repair/fixes.patch
          test "$(git ls-remote origin refs/heads/feat/conversational-memory-e2e | cut -f1)" = "$GITHUB_SHA"
          git -c user.name=777genius -c user.email=iliyazelenkog@gmail.com commit -m "fix(e2e): warm real Next scripts within the existing boot deadline"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/conversational-memory-e2e
          git rev-parse HEAD > tmp/memory-browser-repair/published-sha.txt
          git archive --format=tar.gz HEAD scripts/accounts-reference-e2e scripts/accounts-reference-e2e-warmup.test.ts package.json vitest.config.ts ai-docs/plans/2026-10-28-conversational-memory-and-shared-llm.md ai-docs/plans/2026-10-28-conversational-memory-implementation.md scripts/conversation-evals apps/api/src/review-memory-runtime.ts packages/features/memory > tmp/memory-browser-repair/qualified-source.tar.gz
          printf 'Qualified fixture commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-browser-repair-${{ github.sha }}
          path: tmp/memory-browser-repair/
          if-no-files-found: warn
          retention-days: 3
