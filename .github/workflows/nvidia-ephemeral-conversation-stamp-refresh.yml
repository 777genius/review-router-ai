# Temporary exact-head generator for repository-owned conversation source receipts.
# No provider call, no production deployment, no release publication.
name: NVIDIA ephemeral conversation stamp refresh
on:
  push:
    branches: [feat/nvidia-build-gateway-sandbox]
    paths: [".github/workflows/nvidia-ephemeral-conversation-stamp-refresh.yml"]
permissions:
  contents: write
concurrency:
  group: nvidia-stamp-refresh
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == '777genius/review-router-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Move to current candidate before generating source-stamped outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/nvidia-build-gateway-sandbox
          git checkout -B feat/nvidia-build-gateway-sandbox FETCH_HEAD
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --ignore-scripts --frozen-lockfile
          node scripts/prepare-pinned-subscription-runtime.ts
      - name: Regenerate and verify existing conversation source and standalone verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-conversation-source-stamp.ts --write
          node scripts/check-conversation-release-verifier.ts --write
          node scripts/check-conversation-source-stamp.ts --check
          node scripts/check-conversation-release-verifier.ts --check
          git diff --check
      - name: Commit generated bytes only, not release/production
        shell: bash
        run: |
          set -euo pipefail
          git add -- packages/platform/config/src/conversation-source-stamp.json deploy/self-hosted/conversation-verifier.mjs deploy/self-hosted/conversation-verifier.d.mts deploy/self-hosted/conversation-verifier.inputs.json deploy/self-hosted/conversation-verifier.NOTICE
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'chore: regenerate exact NVIDIA conversation source stamp and verifier'
          git push origin HEAD:feat/nvidia-build-gateway-sandbox
