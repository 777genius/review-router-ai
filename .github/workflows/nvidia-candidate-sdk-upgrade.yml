# One-shot, sandbox-only private SDK consumer upgrade. No npm publish or deploy.
name: NVIDIA candidate SDK source-pinned upgrade
on:
  push:
    branches: [feat/nvidia-build-gateway-sandbox]
    paths: [".github/workflows/nvidia-candidate-sdk-upgrade.yml"]
permissions:
  contents: write
concurrency:
  group: nvidia-sdk-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upgrade:
    if: github.repository == '777genius/review-router-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Import exact qualified SDK artifact without changing upstream dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/nvidia-build-gateway-sandbox
          git checkout -B feat/nvidia-build-gateway-sandbox FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/nvidia-sdk"
          gh api -H 'Accept: application/vnd.github+json' repos/agent-teams-ai/account-gateway/actions/artifacts/13849063492/zip > "$RUNNER_TEMP/nvidia-sdk.zip"
          unzip -q "$RUNNER_TEMP/nvidia-sdk.zip" -d "$RUNNER_TEMP/nvidia-sdk"
          file="$RUNNER_TEMP/nvidia-sdk/agent-teams-account-gateway-0.1.0.tgz"
          test "$(sha256sum "$file" | cut -d' ' -f1)" = 'db48123fb46dc59b025af4a43a5b8d8af1230c14ed066b3225ca7a9d2d290ba9'
          cp "$file" vendor/account-gateway/agent-teams-account-gateway-0.1.0-nvidia-c32ef9ed3360.tgz
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const newName='agent-teams-account-gateway-0.1.0-nvidia-c32ef9ed3360.tgz';
          for(const path of ['apps/web/package.json','apps/api/package.json','packages/features/provider-usage/package.json']){
            const s=fs.readFileSync(path,'utf8');
            const next=s.replace(/agent-teams-account-gateway-0\.1\.0-nvidia-b6cf011965f4\.tgz/g,newName);
            if(next===s)throw Error('expected previous candidate in '+path);
            fs.writeFileSync(path,next);
          }
          const archive=fs.readFileSync('vendor/account-gateway/'+newName);
          const evidence=JSON.parse(fs.readFileSync('vendor/account-gateway/nvidia-sandbox-sdk-provenance.json','utf8'));
          evidence.archive=newName;
          evidence.sha256=crypto.createHash('sha256').update(archive).digest('hex');
          evidence.integrity='sha512-'+crypto.createHash('sha512').update(archive).digest('base64');
          evidence.sdkSourceCommit='c32ef9ed3360d2632a403be6c8e7e3bcf2780439';
          evidence.artifactRun='https://github.com/agent-teams-ai/account-gateway/actions/runs/43008848474';
          evidence.artifactId=13849063492;
          evidence.qualification.sdkConsumerChecks='pending_exact_head';
          evidence.qualification.hostedNvidiaBuildInference='nemotron_direct_chat_and_stream_two_turn_pass; protected_bridge_pending';
          evidence.qualification.actualGitHubAppReview='not_qualified';
          fs.writeFileSync('vendor/account-gateway/nvidia-sandbox-sdk-provenance.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          npm install --prefix "$RUNNER_TEMP/nvidia-pnpm" --ignore-scripts --no-audit pnpm@11.28.7
          node "$RUNNER_TEMP/nvidia-pnpm/node_modules/pnpm/bin/pnpm.cjs" --config.engine-strict=true install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git rm -f -- vendor/account-gateway/agent-teams-account-gateway-0.1.0-nvidia-b6cf011965f4.tgz
          git add apps/web/package.json apps/api/package.json packages/features/provider-usage/package.json pnpm-lock.yaml vendor/account-gateway/nvidia-sandbox-sdk-provenance.json vendor/account-gateway/agent-teams-account-gateway-0.1.0-nvidia-c32ef9ed3360.tgz
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: pin live-qualified Nemotron SDK candidate and lockfile'
          git push origin HEAD:feat/nvidia-build-gateway-sandbox
