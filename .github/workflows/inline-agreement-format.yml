name: Inline agreement CI format (temporary)
on:
  push:
    branches:
      - fix/inline-agreement-ui-20261107
    paths:
      - .github/workflows/inline-agreement-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned formatter
        run: npm install --global --ignore-scripts --no-audit --no-fund prettier@3.8.3
      - name: Format only the files reported by CI
        run: |
          prettier --write \
            ai-docs/deployments/2026-11-07-inline-agreement-dashboard.md \
            deploy/self-hosted/install-agent.test.ts \
            deploy/self-hosted/install.ts
      - name: Commit and push exact format fixes
        run: |
          git config user.name 'reviewrouter-format-ci[bot]'
          git config user.email 'reviewrouter-format-ci[bot]@users.noreply.github.com'
          git add -- ai-docs/deployments/2026-11-07-inline-agreement-dashboard.md deploy/self-hosted/install-agent.test.ts deploy/self-hosted/install.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(ci): apply pinned formatting to failing files'
            git push origin HEAD:refs/heads/fix/inline-agreement-ui-20261107
          fi
