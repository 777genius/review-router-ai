# Temporary read-only diagnostics for this draft; remove after verification.
name: Unified OCR offline diagnostics
on:
  push:
    branches: [feat/unified-ocr-review-20261026]
    paths: [.github/workflows/unified-ocr-offline-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Preserve exact failed-check logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocr-diagnostics/logs"
          for job in 123350931018 123350930868 123350930861 123350930993 123350930984 123350930804; do
            gh api "repos/777genius/review-router-ai/actions/jobs/$job/logs" > "$RUNNER_TEMP/ocr-diagnostics/logs/$job.log"
          done
      - name: Install only the locked local development toolchain
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Archive dependency bytes without credentials or repository configuration
        run: |
          set -euo pipefail
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/ocr-diagnostics/dependencies.tar.gz"
          cp -R "$(npm root -g)/pnpm" "$RUNNER_TEMP/ocr-diagnostics/pnpm"
          cp "$(command -v node)" "$RUNNER_TEMP/ocr-diagnostics/node"
          git rev-parse HEAD > "$RUNNER_TEMP/ocr-diagnostics/source-revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ocr-diagnostics/source.tar.gz"
          cd "$RUNNER_TEMP/ocr-diagnostics"
          sha256sum dependencies.tar.gz source.tar.gz node > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-ocr-offline-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/ocr-diagnostics/
          retention-days: 1
          if-no-files-found: error
