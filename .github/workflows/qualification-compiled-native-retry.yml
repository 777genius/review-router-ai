name: Compiled native retry qualification

on:
  push:
    branches:
      - qualification/compiled-native-retry-cf2-20261128

permissions:
  contents: read

concurrency:
  group: compiled-native-retry-cf2-20261128
  cancel-in-progress: true

env:
  NODE_VERSION: "26.11.1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  AUTH_SECRET: ci-auth-secret-not-used-for-production
  AUTH_TRUST_HOST: "true"
  GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-used-for-production
  REVIEW_ROUTER_WEB_URL: http://localhost:3000
  REVIEW_ROUTER_PUBLIC_WEB_URL: https://web.reviewrouter.test
  REVIEW_ROUTER_API_URL: http://localhost:4000
  REVIEW_ROUTER_PUBLIC_API_URL: https://api.reviewrouter.test
  REVIEW_ROUTER_ACTION_REF: 777genius/review-router@main
  REVIEW_ROUTER_ACTION_VERSION: main
  REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: 777genius/review-router@66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
  REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS: ""
  # Public test fixture only; production uses one secret-manager value shared
  # by every database writer.
  REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ci_database_recovery_witness_not_for_production_000000000000
  REVIEW_ROUTER_DEFAULT_MODEL: gpt-5.5
  REVIEW_ROUTER_DEFAULT_EFFORT: xhigh
  REVIEW_ROUTER_PAIRED_ACTION_REF: 1ce5d0abc8300d024ec75c556df1ebbb41c3cbe7
  REVIEW_ROUTER_HOSTED_POOL_ACTION_TAG: v1.0.171
  REVIEW_ROUTER_HOSTED_POOL_ACTION_SHA: 66ac53a5953c2da498f7d2c3b644dd6ef5ccf3ff
  REVIEW_ROUTER_HOSTED_POOL_ACTION_DIST_SHA256: 2a65907ac8474f805dcb23358618c9c673e6a903bf1c3c26fcdf4cfe02debe2a
  REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS: "0"
  REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "0"
  REVIEW_ROUTER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
  REVIEW_ROUTER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore

jobs:
  joined-native-retry:
    name: Compiled native retry (Node ${{ matrix.node }})
    if: ${{ github.repository == '777genius/review-router-ai' && github.actor == '777genius' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ["24.21.0", "26.11.1"]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/review_router_ci_test?schema=public
      REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/review_router_ci_test?schema=public
      REVIEW_ROUTER_REVIEW_INVESTIGATION_PAIRED_E2E: "1"
      RR_JOINED_NODE_VERSION: ${{ matrix.node }}
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-app-test:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout immutable current aggregate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cf2cfad7128f76e0d7b33522c126de1f980dfaf5
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.11.1"

      - name: Bind exact source inputs
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf2cfad7128f76e0d7b33522c126de1f980dfaf5
          test "$(git rev-parse HEAD^{tree})" = 092dabfb2c02542efbe43c74f620e122f02c3aa9
          test "$(git hash-object apps/api/src/gateway-multi-reviewers-paired.e2e.test.ts)" = 57b5c97da23ef23d9faf211b8d9c86c6f8bcb3ef
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.ts)" = 221ffcd2e5af465767745a3ef628c568c9c7bee5
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.test.ts)" = 32d4374087f626de4f52ef3d4af165930679ddc3
          test "$(git hash-object scripts/review-action-v2-production-e2e/review-action-v2-production.e2e.test.ts)" = 5825f3be89b9126f0fe654c2f5ef64dcb7b63ad8
          test "$(git hash-object .github/workflows/ci.yml)" = 6db91a72f667cfda74034bb52d3a2afec73d9750
          test "$(git hash-object pnpm-lock.yaml)" = d7fca2ff60cb5e9a6de06cc775ab4dfbf535f20a
          test "$(git hash-object package.json)" = 6f9bc20944432a7dd714ae48232fe79921eafbf1
          test "$(git hash-object scripts/paired-action-qualification/check-cold-recovery-results.ts)" = c0165ea886bc818a0e8b1cbe268856e610a699d3
          mkdir -p tmp/compiled-native-retry-qualification
          git log -1 --format='%H %T' > tmp/compiled-native-retry-qualification/source.txt
          node --version >> tmp/compiled-native-retry-qualification/source.txt

      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.28.7

      - name: Install PostgreSQL 17 client
        uses: ./.github/actions/setup-postgresql-client

      - name: Install frozen source dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile

      - name: Generate offline Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs

      - name: Bootstrap native contract sources
        id: bootstrap
        run: |
          node scripts/check-review-action-v2-protocol.mjs --bootstrap-only
          pnpm --filter @reviewrouter/protocol-review-action-v2 build
          node scripts/rewrite-dist-esm-imports.mjs

      - name: Prepare ordinary PostgreSQL 17 schemas
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_ci'
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_provider_scope_ci_test'
          psql -X -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_ci_test'
          test "$(psql -XqAt -h 127.0.0.1 -p 5433 -U postgres -d review_router_ci_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname IN ('reviewrouter_release_migration', 'reviewrouter_release_schema_owner')")" = 0
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --dir packages/platform/db db:migrate:deploy
          test "$(psql -XqAt -h 127.0.0.1 -p 5433 -U postgres -d review_router_ci_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='codex_oauth_provider_identity_guard' AND pg_catalog.pg_get_userbyid(p.proowner)='postgres'")" = 1
          test "$(psql -XqAt -h 127.0.0.1 -p 5433 -U postgres -d review_router_ci_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname='reviewrouter_release_migration'")" = 0
          pnpm db:migrate:deploy

      - name: Checkout immutable paired Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 777genius/review-router
          ref: 1ce5d0abc8300d024ec75c556df1ebbb41c3cbe7
          path: .paired/review-router-action
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify paired Action provenance
        id: action_provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .paired/review-router-action rev-parse HEAD)" = 1ce5d0abc8300d024ec75c556df1ebbb41c3cbe7
          test "$(git -C .paired/review-router-action rev-parse HEAD^{tree})" = f07fa75ec037d43a30632ac20e489871b637b577
          git -C .paired/review-router-action merge-base --is-ancestor 36bf99ae7fba5553a428eeb1e641945e7afa99ac HEAD
          git -C .paired/review-router-action log -1 --format='%H %T' >> tmp/compiled-native-retry-qualification/source.txt

      - name: Install paired Action locked dependencies
        id: action_install
        run: npm ci --ignore-scripts --prefix .paired/review-router-action

      - name: Checkout qualified Native request-retry producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-teams-ai/sub2api-standalone
          ref: f6e05bf458fc447fb641b786d3ec911c592a18ec
          path: .paired/native-request-retry
          persist-credentials: false

      - name: Checkout qualified Gateway request-retry producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-teams-ai/account-gateway
          ref: 90739814c9e85fcf3ac9e9e6a0b2ea68b3131d28
          path: .paired/gateway-request-retry
          persist-credentials: false

      - name: Set up pinned Go for the existing joined Native fixture
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.4"
          cache: false

      - name: Build the qualified Gateway fixture dependencies
        id: native_prepare
        run: |
          test "$(node --version)" = v26.11.1
          echo "REVIEW_ROUTER_NATIVE_RETRY_NODE26=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
          test "$(git -C .paired/native-request-retry rev-parse HEAD)" = f6e05bf458fc447fb641b786d3ec911c592a18ec
          test "$(git -C .paired/gateway-request-retry rev-parse HEAD)" = 90739814c9e85fcf3ac9e9e6a0b2ea68b3131d28
          test "$(go env GOVERSION)" = go1.27.4
          npm install --prefix "$RUNNER_TEMP/native-retry-pnpm" --ignore-scripts pnpm@11.28.2
          export PATH="$RUNNER_TEMP/native-retry-pnpm/node_modules/.bin:$PATH"
          test "$(pnpm --version)" = 11.28.2
          node "$RUNNER_TEMP/native-retry-pnpm/node_modules/pnpm/bin/pnpm.cjs" --dir .paired/gateway-request-retry install --frozen-lockfile
          node "$RUNNER_TEMP/native-retry-pnpm/node_modules/pnpm/bin/pnpm.cjs" --dir .paired/gateway-request-retry run build

      - name: Qualify current aggregate cold recovery and original receipt (Node 26)
        id: cold
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.bootstrap.outcome == 'success' && steps.action_provenance.outcome == 'success' && steps.action_install.outcome == 'success' && steps.native_prepare.outcome == 'success' && matrix.node == '26.11.1' }}
        env:
          REVIEW_ROUTER_ACTION_SOURCE_DIR: ${{ github.workspace }}/.paired/review-router-action
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.11.1
          rm -f tmp/compiled-native-retry-qualification/cold-results.json tmp/multi-reviewer-e2e/accepted-result-recovery.json
          pnpm exec vitest run --configLoader native --no-file-parallelism --maxWorkers=1 \
            apps/api/src/gateway-multi-reviewers-paired.e2e.test.ts \
            --testNamePattern "^runs the compiled entrypoint through real API/SQL with accepted-result-recovery Gateway allocations$" \
            --reporter=default --reporter=json \
            --outputFile=tmp/compiled-native-retry-qualification/cold-results.json \
            2>&1 | tee tmp/compiled-native-retry-qualification/cold-test.log
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/paired-action-qualification/check-cold-recovery-results.ts \
            tmp/compiled-native-retry-qualification/cold-results.json \
            tmp/multi-reviewer-e2e/accepted-result-recovery.json

      - name: Set up Node 24 for joined request-retry qualification
        id: paired_native_retry_node24
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.bootstrap.outcome == 'success' && steps.action_provenance.outcome == 'success' && steps.action_install.outcome == 'success' && steps.native_prepare.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Compiled Action to RR, Gateway and actual Native request-retry E2E
        id: paired_native_retry
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.bootstrap.outcome == 'success' && steps.action_provenance.outcome == 'success' && steps.action_install.outcome == 'success' && steps.native_prepare.outcome == 'success' && steps.paired_native_retry_node24.outcome == 'success' }}
        timeout-minutes: 20
        env:
          REVIEW_ROUTER_NATIVE_RETRY_JOINED_E2E: "1"
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          pg_name=""
          trap 'if [[ -n "$pg_name" ]]; then docker rm -f "$pg_name" >/dev/null; fi' EXIT
          export REVIEW_ROUTER_ACTION_SOURCE_DIR="$GITHUB_WORKSPACE/.paired/review-router-action"
          export REVIEW_ROUTER_NATIVE_RETRY_NATIVE_SOURCE="$GITHUB_WORKSPACE/.paired/native-request-retry"
          export REVIEW_ROUTER_NATIVE_RETRY_GATEWAY_SOURCE="$GITHUB_WORKSPACE/.paired/gateway-request-retry"
          node24="$(node -p 'process.execPath')"
          test "$("$node24" --version)" = v24.21.0
          node26="$REVIEW_ROUTER_NATIVE_RETRY_NODE26"
          test "$("$node26" --version)" = v26.11.1
          original_path="$PATH"
          rm -rf tmp/native-retry-paired
          mkdir -p tmp/native-retry-paired
          case "$RR_JOINED_NODE_VERSION" in
            24.21.0) selected_node="$node24" ;;
            26.11.1) selected_node="$node26" ;;
            *) echo "Unexpected joined Node lane" >&2; exit 1 ;;
          esac
          for node_executable in "$selected_node"; do
            export PATH="$(dirname "$node_executable"):$original_path"
            test "$(node -p 'process.execPath')" = "$node_executable"
            node_version="$(node --version)"
            test "$node_version" = "v$RR_JOINED_NODE_VERSION"
            node --version
            pg_name="rr-native-retry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$node_version"
            docker run -d --rm --name "$pg_name" -e POSTGRES_PASSWORD=postgres -p 127.0.0.1::5432 \
              postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
            for attempt in $(seq 1 30); do
              if docker exec "$pg_name" pg_isready -U postgres; then break; fi
              sleep 1
            done
            docker exec "$pg_name" pg_isready -U postgres
            pg_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$pg_name")"
            export REVIEW_ROUTER_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:$pg_port/review_router_native_retry_ci"
            for db in review_router_native_retry_ci native_non_entry_rr_private_ci native_non_entry_rr_public_ci ag_kernel_test_non_entry_rr_retry_private_ci ag_kernel_test_non_entry_rr_retry_public_ci; do
              docker exec "$pg_name" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            done
            DATABASE_URL="$REVIEW_ROUTER_TEST_DATABASE_URL" pnpm --dir packages/platform/db db:migrate:deploy
            rm -f tmp/native-retry-paired/{private,public}.json \
              tmp/native-retry-paired/{private,public}-action.log \
              tmp/native-retry-paired/{private,public}-native.log \
              tmp/native-retry-paired/results.json
            lane_dir="tmp/native-retry-paired/node-$node_version"
            rm -rf "$lane_dir"
            mkdir -p "$lane_dir"
            pnpm exec vitest run apps/api/src/gateway-multi-reviewers-paired.e2e.test.ts \
              --testNamePattern "joins the compiled Action with real native attested retry" \
              --reporter=default --reporter=json --outputFile=tmp/native-retry-paired/results.json
            jq -e \
              --arg private "joins the compiled Action with real native attested retry through private ingress" \
              --arg public "joins the compiled Action with real native attested retry through public ingress" \
              '.success == true and .numFailedTests == 0 and .numPassedTests == 2 and
                ([.testResults[].assertionResults[] | select(.fullName == $private or .fullName == $public)] |
                  length == 2 and all(.status == "passed") and
                  (map(.fullName) | sort) == ([$private, $public] | sort))' \
              tmp/native-retry-paired/results.json
            for mode in private public; do
              jq -e --arg node "$node_version" --arg mode "$mode" \
                '.contract == "native-non-entry-consumer/v1" and .nodeVersion == $node and .mode == $mode and .spentDispatches == 3 and .completedProviderTurns == 2 and .originalGatewayGrants == 1 and .heldAckDeniedSuccessor and .oneIdenticalSuccessor and .originalPaidTurnPreserved and .publications == 1' \
                "tmp/native-retry-paired/$mode.json"
            done
            mv tmp/native-retry-paired/{private,public}.json \
              tmp/native-retry-paired/{private,public}-action.log \
              tmp/native-retry-paired/{private,public}-native.log \
              tmp/native-retry-paired/results.json "$lane_dir/"
            docker rm -f "$pg_name" >/dev/null
            pg_name=""
          done

      - name: Preserve joined Native request-retry proof
        if: always() && steps.paired_native_retry.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-request-retry-cf2-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/native-retry-paired/
          if-no-files-found: error
          retention-days: 30

      - name: Restore Node 26 after joined request-retry qualification
        if: always() && steps.paired_native_retry_node24.outcome != 'skipped'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify source stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cf2cfad7128f76e0d7b33522c126de1f980dfaf5
          test "$(git rev-parse HEAD^{tree})" = 092dabfb2c02542efbe43c74f620e122f02c3aa9
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git hash-object apps/api/src/gateway-multi-reviewers-paired.e2e.test.ts)" = 57b5c97da23ef23d9faf211b8d9c86c6f8bcb3ef
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.ts)" = 221ffcd2e5af465767745a3ef628c568c9c7bee5
          test "$(git hash-object packages/features/review-progress/src/domain/review-progress.test.ts)" = 32d4374087f626de4f52ef3d4af165930679ddc3
          test "$(git hash-object scripts/review-action-v2-production-e2e/review-action-v2-production.e2e.test.ts)" = 5825f3be89b9126f0fe654c2f5ef64dcb7b63ad8
          test "$(git hash-object .github/workflows/ci.yml)" = 6db91a72f667cfda74034bb52d3a2afec73d9750
          test "$(git hash-object pnpm-lock.yaml)" = d7fca2ff60cb5e9a6de06cc775ab4dfbf535f20a
          test "$(git hash-object package.json)" = 6f9bc20944432a7dd714ae48232fe79921eafbf1
          test "$(git hash-object scripts/paired-action-qualification/check-cold-recovery-results.ts)" = c0165ea886bc818a0e8b1cbe268856e610a699d3

      - name: Preserve current source and cold evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-native-retry-source-cf2-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/compiled-native-retry-qualification/
            tmp/multi-reviewer-e2e/accepted-result-recovery.json
          if-no-files-found: error
          retention-days: 30
