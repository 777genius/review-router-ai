<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">ReviewRouter — Watch video</title>
  <desc id="description">Product walkthrough banner with a prominent play icon and Watch video label.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12152c"/>
      <stop offset=".55" stop-color="#0a1b2a"/>
      <stop offset="1" stop-color="#18112c"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce9ff"/>
      <stop offset="1" stop-color="#bbf791"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#57dbff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#57dbff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 H 0 V 56" fill="none" stroke="#a3d5f7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <clipPath id="edges"><rect width="1200" height="780" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#edges)">
    <rect width="1200" height="780" fill="url(#background)"/>
    <rect width="1200" height="780" fill="url(#grid)"/>
    <ellipse cx="603" cy="395" rx="500" ry="350" fill="url(#glow)"/>
    <rect x="24" y="24" width="1152" height="732" rx="20" fill="none" stroke="#77bfdc" stroke-opacity=".3" stroke-width="2"/>
    <g transform="translate(80 68)">
      <path d="M0 18 H37 L53 37 L37 56 H0 L16 37 Z" fill="none" stroke="#7ce9ff" stroke-width="5" stroke-linejoin="round"/>
      <text x="75" y="53" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#ebfbff">ReviewRouter</text>
      <text x="0" y="99" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="4.6" fill="#a4bcd1">PRODUCT WALKTHROUGH</text>
    </g>
    <g opacity=".64">
      <rect x="95" y="242" width="398" height="342" rx="20" fill="#08131e" stroke="#30617a" stroke-width="2"/>
      <circle cx="134" cy="278" r="7" fill="#a7f2d0"/><circle cx="158" cy="278" r="7" fill="#77dff0"/><circle cx="182" cy="278" r="7" fill="#da99ed"/>
      <text x="128" y="335" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#d0e9f3">AI review findings</text>
      <rect x="130" y="365" width="310" height="16" rx="8" fill="#527c96"/>
      <rect x="130" y="401" width="240" height="16" rx="8" fill="#36566f"/>
      <rect x="130" y="458" width="320" height="62" rx="12" fill="#0f3735" stroke="#4b9586"/>
      <circle cx="166" cy="489" r="12" fill="#9bf9c3"/>
      <path d="m159 489 6 6 10-12" fill="none" stroke="#0f3735" stroke-width="4" stroke-linecap="round"/>
      <rect x="194" y="481" width="217" height="17" rx="8" fill="#82d8b5"/>
      <rect x="130" y="544" width="277" height="13" rx="6.5" fill="#3b6277"/>
    </g>
    <g opacity=".66">
      <rect x="704" y="242" width="400" height="342" rx="20" fill="#08131e" stroke="#30617a" stroke-width="2"/>
      <text x="745" y="307" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#d0e9f3">Your models and usage</text>
      <path d="M749 519 V424 M811 519 V394 M873 519 V445 M935 519 V352 M997 519 V382 M1059 519 V402" stroke="#335a6c" stroke-width="31" stroke-linecap="round"/>
      <path d="M749 519 V464 M811 519 V425 M873 519 V464 M935 519 V392 M997 519 V410 M1059 519 V437" stroke="#80ebed" stroke-opacity=".83" stroke-width="31" stroke-linecap="round"/>
    </g>
    <circle cx="600" cy="411" r="139" fill="#061726" fill-opacity=".83"/>
    <circle cx="600" cy="411" r="110" fill="#10293b" stroke="#8ee4f3" stroke-width="5"/>
    <circle cx="600" cy="411" r="85" fill="url(#play)"/>
    <path d="M576 361 V461 L667 411 Z" fill="#0c2b3d"/>
    <rect x="413" y="616" width="374" height="91" rx="45.5" fill="#102b3d" stroke="#88e6f2" stroke-width="2"/>
    <text x="600" y="674" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" text-anchor="middle" fill="#f4ffff">Watch video</text>
  </g>
